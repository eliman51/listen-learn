 Council.","src":["o7d","ocs"],"rq":"What happened in 692?","ra":"The Council in Trullo, the Quinisext Council, issued 102 canons."},{"id":"c6-21","t":1,"q":"Why is it called Quinisext, meaning fifth-sixth?","a":"Because its canons complete the Fifth and Sixth Councils, which issued none.","src":["o7d","ocs"]},{"id":"c6-22","t":2,"q":"What did canon 13 of Trullo uphold against Roman practice?","a":"The lawful marriages of deacons and priests.","src":["o7d"]},{"id":"c6-23","t":2,"q":"How do Rome and the Orthodox each regard the Council in Trullo?","a":"Rome never accepted it. The Orthodox give its canons the authority of an Ecumenical Council.","src":["o7d","o7e"]},{"id":"c6-24","t":2,"q":"What year marks the start of the Muslim era, and why?","a":"622, when Mohammed left Mecca for Medina.","src":["o7f"]},{"id":"c6-25","t":2,"q":"Which lands did the Arab armies take from the Empire by 644?","a":"Egypt, Palestine, and Syria, along with Mesopotamia and Persia.","src":["o7f"]},{"id":"c6-26","t":2,"q":"How did the Arab conquests affect the division over Chalcedon?","a":"Nearly all the non-Chalcedonian Christians came under Muslim rule, which ended the hope of reunion with the Byzantine Church.","src":["o7f","o7b","oqa"]},{"id":"c6-27","t":2,"q":"Who wrote The Ladder of Divine Ascent?","a":"Saint John Climacus, abbot of Saint Catherine's Monastery on Mount Sinai.","src":["o7g"]}]}]},{"id":"n2","n":13,"title":"Seventh Council: Nicaea, 787, and the Icons","era":"726 to 843","council":7,"segs":[{"id":"n2-s1","title":"The breaking of images","text":"Iconoclasm means the breaking of images. The emperor Leo the Third saved Constantinople from an Arab siege in 717 to 718. Then, from 726, he issued edicts against the holy icons, calling them idols. Saint Germanus, patriarch of Constantinople, was deposed in 730 for refusing to go along. The great defender of the icons was Saint John of Damascus, a monk of Saint Sabas Monastery in Palestine, who died in 749. He taught that because God became man and was seen in the flesh, he can be depicted. Icons receive veneration, in Greek proskynesis. Worship, in Greek latreia, belongs to God alone.","cards":[{"id":"n2-01","t":1,"q":"What does iconoclasm mean, and which emperor began it?","a":"The breaking of images. The emperor Leo the Third began it with edicts against icons from 726.","src":["o8a","b-nic2"]},{"id":"n2-02","t":1,"q":"Who was the great defender of icons in the first period of iconoclasm?","a":"Saint John of Damascus, a monk of Saint Sabas Monastery in Palestine.","src":["o8a","b-jdam"]},{"id":"n2-03","t":1,"q":"What is the main argument of Saint John of Damascus for icons?","a":"Because God became man and was seen in the flesh, he can be depicted.","src":["o8a","oqa"]},{"id":"n2-04","t":1,"q":"What distinction did Saint John of Damascus draw about honoring icons?","a":"Icons receive veneration. Worship belongs to God alone.","src":["o8a","b-nic2"]},{"id":"n2-05","t":2,"q":"Give the Greek words for veneration and for worship.","a":"Proskynesis is veneration. Latreia is worship.","src":["o8a"]},{"id":"n2-06","t":2,"q":"Which patriarch of Constantinople was deposed in 730 for refusing to reject icons?","a":"Saint Germanus.","src":["o8a"]},{"id":"n2-07","t":2,"q":"When did Saint John of Damascus die, and what are his main works?","a":"He died in 749. He wrote On the Holy Images and The Fount of Knowledge, which contains his Exposition of the Orthodox Faith.","src":["o8a","o8c","b-jdam"]}]},{"id":"n2-s2","title":"A false council and a true one","text":"Leo's son, Constantine the Fifth, was harsher. In 754 he gathered 338 bishops at Hieria, near Constantinople, in a council that condemned icons. The Church rejects it as a false council. From 762 to 775, the decade of blood, hundreds of monks were tortured or killed. Relief came through the empress Irene and Patriarch Tarasius. The Seventh Ecumenical Council opened at Nicaea on September 24, 787. Pope Hadrian the First sent legates and confirmed it. The council decreed that icons are to be displayed and venerated, but not given the worship due to God alone. It issued 22 canons. Canon 7 requires relics in every church.","cards":[{"id":"n2-08","t":1,"q":"In what year did the Seventh Ecumenical Council meet, and where?","a":"In 787, at Nicaea.","src":["o8a","b-nic2","oct"],"rq":"What happened in 787?","ra":"The Seventh Ecumenical Council met at Nicaea and restored the veneration of icons.","hook":"Seven, eight, seven: the Seventh council begins and ends with seven."},{"id":"n2-09","t":1,"q":"Which empress and patriarch brought about the Seventh Council?","a":"The empress Irene and Patriarch Tarasius of Constantinople.","src":["o8a","b-nic2"]},{"id":"n2-10","t":1,"q":"What did the Seventh Council decree?","a":"Icons are to be displayed and venerated, but not given the worship that belongs to God alone.","src":["o8a","b-nic2","oct"]},{"id":"n2-11","t":2,"q":"What was the iconoclast council of 754?","a":"A council of 338 bishops at Hieria, near Constantinople, called by Constantine the Fifth, that condemned icons. The Church rejects it as a false council.","src":["o8a","w-nic2"]},{"id":"n2-12","t":3,"q":"On what date did the Seventh Council open, and how many bishops signed?","a":"September 24, 787. About 308 bishops signed, among roughly 350 members.","src":["w-nic2","enc-nic2","na-nic2"]},{"id":"n2-13","t":2,"q":"How many canons did the Seventh Council issue, and what did canon 7 require?","a":"Twenty-two. Canon 7 required relics in every church.","src":["o8a","b-nic2"]},{"id":"n2-14","t":2,"q":"Which pope sent legates and confirmed the Seventh Council?","a":"Pope Hadrian the First.","src":["b-nic2","o8b"]},{"id":"n2-15","t":2,"q":"Why did Charlemagne's court attack the Seventh Council in the Libri Carolini?","a":"A faulty Latin translation blurred veneration with adoration, and Charlemagne wished to discredit the Eastern empire.","src":["o8b","b-nic2","oqa"]},{"id":"n2-16","t":3,"q":"What were the years of the decade of blood under Constantine the Fifth?","a":"762 to 775.","src":["o8a"]},{"id":"n2-17","t":3,"q":"When does the Church commemorate the Fathers of the Seventh Council?","a":"On the Sunday nearest October 11.","src":["ocs"]}]},{"id":"n2-s3","title":"The Triumph of Orthodoxy","text":"Iconoclasm came back. In 815 the emperor Leo the Fifth, the Armenian, ordered the icons hung out of reach. On Palm Sunday of that year Saint Theodore the Studite, abbot of the Studion Monastery, led a procession with icons in open defiance, and was exiled. The persecution lasted until the emperor Theophilus died in 842. His widow, Saint Theodora, ruled for their young son Michael the Third. In March 843 Saint Methodius became patriarch, and on March 11, the first Sunday of Great Lent, the icons were carried back in procession. The Church keeps that day every year as the Sunday of Orthodoxy.","cards":[{"id":"n2-18","t":1,"q":"What is the Triumph of Orthodoxy, and when did it happen?","a":"The final restoration of the icons on March 11, 843, the first Sunday of Great Lent.","src":["o9a"],"rq":"What happened in 843?","ra":"The Triumph of Orthodoxy: the icons were restored for good under the empress Theodora."},{"id":"n2-19","t":1,"q":"Which empress restored the icons in 843?","a":"Saint Theodora, regent for her son Michael the Third.","src":["o9a","oqa"]},{"id":"n2-20","t":1,"q":"When does the Church celebrate the Sunday of Orthodoxy?","a":"Every year on the first Sunday of Great Lent.","src":["o9a","oqa"]},{"id":"n2-21","t":2,"q":"Which emperor began the second period of iconoclasm, and in what year?","a":"Leo the Fifth, the Armenian, in 815.","src":["o9a"]},{"id":"n2-22","t":2,"q":"Who was the chief defender of icons in the second period?","a":"Saint Theodore the Studite, abbot of the Studion Monastery in Constantinople.","src":["o9a"]},{"id":"n2-23","t":2,"q":"Which patriarch was installed in March 843 to restore the icons?","a":"Saint Methodius, who had spent seven years in prison for the icons.","src":["o9a"]},{"id":"n2-24","t":2,"q":"Name the two empresses who ended the two periods of iconoclasm.","a":"Irene ended the first, and Theodora ended the second.","src":["o9a","oqa"]},{"id":"n2-25","t":3,"q":"Who wrote the Great Penitential Canon sung in Great Lent?","a":"Saint Andrew of Crete.","src":["o8c"]}]}]},{"id":"ph","n":14,"title":"Photius, the Slavs, and the Baptism of Rus","era":"Ninth and tenth centuries","segs":[{"id":"ph-s1","title":"The Franks and the filioque","text":"In the eighth century Rome turned from Byzantium toward the Franks. On Christmas Day in the year 800 Pope Leo the Third crowned Charlemagne emperor. Charlemagne had grown up with the filioque and pressed Rome to add it to the Creed. Leo the Third refused and had the original Creed engraved on silver tablets at Saint Peter's. Rome first sang the filioque in public worship only in 1014. In the ninth century Pope Nicholas the First drew the whole Western Church under Rome, leaning on documents later proved to be forgeries, among them the Donation of Constantine.","cards":[{"id":"ph-01","t":1,"q":"What does filioque mean, and why do the Orthodox reject it?","a":"It means, and the Son. It was added to the Creed in the West without a council of the whole Church, and it changes the teaching that the Spirit proceeds from the Father.","src":["o6f","oqa","b-schism"]},{"id":"ph-02","t":1,"q":"Who crowned Charlemagne emperor, and when?","a":"Pope Leo the Third, on Christmas Day in the year 800.","src":["o8b"],"rq":"What happened on Christmas Day in the year 800?","ra":"Pope Leo the Third crowned Charlemagne emperor."},{"id":"ph-03","t":2,"q":"How did Pope Leo the Third respond to pressure to add the filioque?","a":"He refused to add it in Rome, and had the original Creed engraved on silver tablets at Saint Peter's.","src":["o8b"]},{"id":"ph-04","t":2,"q":"In what year did Rome first use the filioque in public worship?","a":"1014, at the coronation of the emperor Henry the Second.","src":["o8b","o11a"]},{"id":"ph-05","t":2,"q":"What was the Donation of Constantine?","a":"A forged document claiming that Constantine gave the bishop of Rome wide powers and lands in Italy.","src":["o9c"]}]},{"id":"ph-s2","title":"Saint Photius the Great","text":"In 858 Photius, a brilliant lay scholar, was made patriarch of Constantinople in place of Ignatius. Pope Nicholas the First refused to recognize him and claimed authority over the East. A Roman council deposed Photius in 863. In 867 a council at Constantinople condemned Nicholas, and for the first time the East formally condemned the filioque. A council in 869 to 870 deposed Photius. He returned in 877, and the council of 879 to 880 restored him, annulled the earlier council, and affirmed the Creed without additions. The Church honors him as one of the Three Pillars of Orthodoxy, with Saint Gregory Palamas and Saint Mark of Ephesus.","cards":[{"id":"ph-06","t":1,"q":"In what year did Saint Photius first become patriarch of Constantinople?","a":"858.","src":["o9d","b-phot"]},{"id":"ph-07","t":1,"q":"Which pope opposed Photius and claimed authority over the Eastern Church?","a":"Pope Nicholas the First.","src":["o9d","b-phot"]},{"id":"ph-08","t":1,"q":"What did the council of Constantinople in 867 do?","a":"It condemned Pope Nicholas for interfering in the East, and it was the first formal Eastern condemnation of the filioque.","src":["o9d","b-phot"]},{"id":"ph-09","t":2,"q":"What did the council of 869 to 870 decide?","a":"It condemned Photius and upheld Ignatius. The Orthodox call it the Ignatian council and do not accept it.","src":["o9d","b-phot"]},{"id":"ph-10","t":1,"q":"What did the council of 879 to 880 decide?","a":"It restored Photius, annulled the council of 869 to 870, and affirmed the Creed without additions.","src":["o9d","b-phot"],"note":"Britannica notes that this council did not condemn the filioque by name."},{"id":"ph-11","t":2,"q":"What were the two periods of Saint Photius as patriarch?","a":"From 858 to 867, and from 877 to 886.","src":["b-phot","o9d"]},{"id":"ph-12","t":2,"q":"Who are the Three Pillars of Orthodoxy?","a":"Saint Photius the Great, Saint Gregory Palamas, and Saint Mark of Ephesus.","src":["o9d"]},{"id":"ph-13","t":3,"q":"What years does the West call the Photian Schism?","a":"863 to 867.","src":["o9d"]}]},{"id":"ph-s3","title":"Apostles to the Slavs","text":"Prince Rastislav of Moravia asked Byzantium for teachers who could preach in the Slavic tongue. The emperor Michael the Third and Patriarch Photius sent two brothers from Thessalonica, Constantine and Methodius. They arrived in 863. Constantine made an alphabet for the Slavs, called Glagolitic, and they translated the services. Frankish clergy insisted that worship could be offered only in Hebrew, Greek, or Latin. Constantine called that the Three-Language Heresy. He died in Rome in 869, having become a monk with the name Cyril. Methodius labored on as archbishop until 885. Their disciples carried the work to Bulgaria, which had accepted Christianity under Khan Boris in 865.","cards":[{"id":"ph-14","t":1,"q":"In what year did Saints Cyril and Methodius begin their mission in Moravia?","a":"863.","src":["o9b","b-cm"],"rq":"What began in 863?","ra":"The mission of Saints Cyril and Methodius to the Slavs of Moravia."},{"id":"ph-15","t":1,"q":"Who sent Saints Cyril and Methodius to the Slavs?","a":"The emperor Michael the Third and Patriarch Photius, at the request of Prince Rastislav of Moravia.","src":["o9b","o9d"]},{"id":"ph-16","t":1,"q":"What alphabet did Saint Cyril create for the Slavs?","a":"The Glagolitic alphabet. The Cyrillic alphabet came later and was named in his honor.","src":["o9b","b-cm"]},{"id":"ph-17","t":2,"q":"What was the Three-Language Heresy?","a":"The claim that worship may be offered only in Hebrew, Greek, or Latin. Saint Cyril opposed it.","src":["o9b"]},{"id":"ph-18","t":2,"q":"Where and when did Saint Cyril die?","a":"In Rome, in 869, shortly after becoming a monk.","src":["o9b","b-cm"]},{"id":"ph-19","t":3,"q":"When did Saint Methodius die?","a":"In 885.","src":["o9b","b-cm"],"note":"OCA gives 885. Britannica gives April 884."},{"id":"ph-20","t":1,"q":"In what year did Bulgaria accept Christianity under Khan Boris?","a":"865.","src":["o9b"]},{"id":"ph-21","t":2,"q":"What title does the Church give Saints Cyril and Methodius?","a":"Evangelizers of the Slavs and Equal to the Apostles.","src":["o9b"]},{"id":"ph-22","t":3,"q":"Which Church became the first new patriarchate beyond the original five?","a":"Bulgaria, under Tsar Symeon, who reigned from 893 to 927.","src":["o10c","oqa"]}]},{"id":"ph-s4","title":"Rus, Athos, and the tenth century","text":"Saint Olga, ruler of Kiev, accepted Christianity around 957. Her grandson Vladimir sent envoys in 987 to study the faiths of his neighbors. Of the worship in Constantinople they reported that God dwells there among men. Vladimir was baptized at Cherson in the Crimea, took the name Basil, and married Anna, sister of the emperor Basil the Second. In 988 the people of Kiev were baptized in the Dnieper River. In the same century Saint Athanasius of Athos founded the Great Lavra, around 960, the first great communal monastery on the Holy Mountain. And Saint Symeon the New Theologian, who lived from 949 to 1022, wrote of the vision of the uncreated light.","cards":[{"id":"ph-23","t":1,"q":"In what year was Kievan Rus baptized under Saint Vladimir?","a":"988, when the people of Kiev were baptized in the Dnieper River.","src":["o10d","b-vlad"],"rq":"What happened in 988?","ra":"The Baptism of Rus: the people of Kiev were baptized in the Dnieper under Saint Vladimir.","note":"OCA dates the baptism of Kiev to spring 988. Britannica places Vladimir's own baptism around 987."},{"id":"ph-24","t":1,"q":"What did Vladimir's envoys report about the worship in Constantinople?","a":"That God dwells there among men.","src":["o10d"]},{"id":"ph-25","t":2,"q":"Who was Saint Olga?","a":"The grandmother of Vladimir, who accepted Christianity around 957 and is honored as Equal to the Apostles.","src":["o10d"]},{"id":"ph-26","t":2,"q":"Where was Saint Vladimir baptized, and what name did he take?","a":"At Cherson in the Crimea. He took the name Basil.","src":["o10d","b-vlad"]},{"id":"ph-27","t":2,"q":"Whom did Vladimir marry after his baptism?","a":"Princess Anna, sister of the emperor Basil the Second.","src":["o10d","b-vlad"]},{"id":"ph-28","t":2,"q":"Who founded the Great Lavra on Mount Athos, and about when?","a":"Saint Athanasius of Athos, around 960.","src":["o10a"],"note":"The date is approximate. OCA gives 960."},{"id":"ph-29","t":2,"q":"Who was Saint Symeon the New Theologian?","a":"An abbot in Constantinople who lived from 949 to 1022 and wrote of the indwelling Holy Spirit and the vision of the uncreated light.","src":["o10a","o4f"]},{"id":"ph-30","t":3,"q":"What did the council of 920 in Constantinople decide about marriage?","a":"That the Church would never bless a fourth marriage.","src":["o10b","oqa"]}]}]},{"id":"sch","n":15,"title":"The Great Schism, 1054","era":"Eleventh century","segs":[{"id":"sch-s1","title":"How East and West grew apart","text":"The schism was not one event. East and West had drifted apart for centuries, in language, in ways of thinking, and in politics. The Orthodox Church sees the chief cause in the claim of the popes to authority over all the Churches, against the ancient order in which each bishop governs his own region. Beside it stood the filioque, and disputes of practice such as the Western use of unleavened bread, called azymes, and required celibacy for clergy. In 1009 Pope Sergius sent a confession of faith containing the filioque. Constantinople removed the pope's name from the diptychs, the list of those commemorated at the Liturgy.","cards":[{"id":"sch-01","t":1,"q":"What does the Orthodox Church see as the main cause of the Great Schism?","a":"The claim of the popes to authority over all the Churches, against the ancient order in which each bishop governs his own region.","src":["o11a","oqa","b-schism"]},{"id":"sch-02","t":1,"q":"Name three issues in dispute at the time of the schism.","a":"The filioque, papal authority, and the Western use of unleavened bread, called azymes.","src":["o11a","b-schism"]},{"id":"sch-03","t":2,"q":"What happened in 1009?","a":"Pope Sergius sent a confession of faith with the filioque, and Constantinople removed the pope's name from the diptychs.","src":["o11a","o8b"]},{"id":"sch-04","t":2,"q":"What are the diptychs?","a":"The official list of Church leaders commemorated at the Liturgy.","src":["o11a"]}]},{"id":"sch-s2","title":"July 16, 1054","text":"Pope Leo the Ninth was a strong reformer who wished to extend papal influence in the East. The patriarch of Constantinople was Michael Cerularius. The pope's legate was Cardinal Humbert. On July 16, 1054, Humbert walked into Hagia Sophia during a service and laid on the altar a bull excommunicating Patriarch Michael and all his followers. Michael in turn excommunicated Humbert and those responsible. Even then the break was not complete. It deepened slowly, and the sack of Constantinople by the Fourth Crusade in 1204 hardened it. In 1965 Pope Paul the Sixth and Patriarch Athenagoras lifted the anathemas of 1054, but the Churches remain out of communion.","cards":[{"id":"sch-05","t":1,"q":"On what date did Cardinal Humbert lay the bull of excommunication on the altar of Hagia Sophia?","a":"July 16, 1054.","src":["o11a"],"rq":"What happened on July 16, 1054?","ra":"Cardinal Humbert laid a bull of excommunication on the altar of Hagia Sophia, the traditional date of the Great Schism."},{"id":"sch-06","t":1,"q":"Who were the pope and the patriarch at the time of the schism of 1054?","a":"Pope Leo the Ninth and Patriarch Michael Cerularius.","src":["o11a","b-schism"]},{"id":"sch-07","t":1,"q":"Who was Cardinal Humbert?","a":"The legate of Pope Leo the Ninth who excommunicated Patriarch Michael in Hagia Sophia.","src":["o11a","oqa"]},{"id":"sch-08","t":1,"q":"How did Patriarch Michael respond to the bull of Humbert?","a":"He excommunicated Humbert and those responsible.","src":["o11a","b-schism"]},{"id":"sch-09","t":2,"q":"Was the schism complete in 1054?","a":"No. It deepened gradually. The sack of Constantinople by the Fourth Crusade in 1204 hardened it.","src":["o11a","b-schism"]},{"id":"sch-10","t":2,"q":"What happened in 1965?","a":"Pope Paul the Sixth and Patriarch Athenagoras lifted the anathemas of 1054, though the Churches remain out of communion.","src":["o11a","b-schism"]},{"id":"sch-11","t":3,"q":"Which teaching of Anselm of Canterbury do the Orthodox regard as a Western innovation?","a":"The satisfaction theory of the atonement.","src":["o11b"]}]}]},{"id":"rev","n":16,"title":"The Seven Councils at a Glance","era":"325 to 787","segs":[{"id":"rev-s1","title":"Seven councils in one breath","text":"Here are the seven Ecumenical Councils in order. First, Nicaea, 325, against Arius: the Son is of one essence with the Father. Second, Constantinople, 381: the Holy Spirit is God, and the Creed is completed. Third, Ephesus, 431, against Nestorius: Christ is one person, and Mary is Theotokos. Fourth, Chalcedon, 451: one person in two natures. Fifth, Constantinople, 553: the Three Chapters and Origen condemned. Sixth, Constantinople, 680 to 681: two wills in Christ. Seventh, Nicaea, 787: the holy icons. The first two gave us the Creed. The next four guard the truth about who Christ is. The seventh defends the icon, because God truly became man.","cards":[{"id":"rev-01","t":1,"q":"Name the cities of the seven Ecumenical Councils in order.","a":"Nicaea, Constantinople, Ephesus, Chalcedon, Constantinople, Constantinople, Nicaea.","src":["oct","ocs"]},{"id":"rev-02","t":1,"q":"Give the years of the seven Ecumenical Councils in order.","a":"325, 381, 431, 451, 553, 680 to 681, and 787.","src":["oct","ocs"],"hook":"Say it as one line, the way you would chant: 325, 381, 431, 451, 553, 680, 787."},{"id":"rev-03","t":1,"q":"Name the error each council answered, in order.","a":"Arianism, Macedonianism, Nestorianism, Monophysitism, the Three Chapters with Origenism, Monothelitism, and Iconoclasm.","src":["ocs","oct"]},{"id":"rev-04","t":1,"q":"Which ruler is linked with each of the seven councils, in order?","a":"Constantine, Theodosius the First, Theodosius the Second, Marcian with Pulcheria, Justinian, Constantine the Fourth, and Irene.","src":["o4d","o4g","o5b","o5d","o6a","b-con3","o8a"]},{"id":"rev-05","t":1,"q":"Name one great teacher of the faith tied to each council, in order.","a":"Athanasius, Gregory the Theologian, Cyril of Alexandria, Leo the Great, Justinian, Maximus the Confessor, and John of Damascus.","src":["o4e","o4g","o5a","o5d","o6a","o7b","o8a"]},{"id":"rev-06","t":1,"q":"Which councils gave the Church the Creed?","a":"The first two: Nicaea in 325 and Constantinople in 381.","src":["oct","o4g"]},{"id":"rev-07","t":1,"q":"Which councils dealt mainly with who Christ is, after the Creed was complete?","a":"The Third through the Sixth: Ephesus, Chalcedon, and the Second and Third Councils of Constantinople.","src":["oct"]},{"id":"rev-08","t":2,"q":"Which two councils met at Nicaea, and what did each defend?","a":"The First, in 325, defended the divinity of the Son. The Seventh, in 787, defended the holy icons.","src":["oct"]},{"id":"rev-09","t":2,"q":"How many years lie between the First Council and the Seventh?","a":"462 years, from 325 to 787.","src":["oct"]}]},{"id":"rev-s2","title":"What a council is","text":"For the Orthodox Church an Ecumenical Council is the highest authority in the Church. Emperors and empresses called the councils together with the bishops, but the bishops made the decisions, and the whole Church received them. A council is not ecumenical because of its size. Some were small. It is ecumenical because the Church in every place and age has recognized in it the voice of the Holy Spirit. Conciliar definitions begin with the words of the Apostles in Acts: It seemed good to the Holy Spirit and to us. Not all Christians receive all seven. The Oriental Orthodox receive the first three, and the Church of the East the first two.","cards":[{"id":"rev-10","t":1,"q":"How does the Orthodox Church regard the Ecumenical Councils?","a":"As the highest authority in the Church, guided by the Holy Spirit and received by the whole Church.","src":["ocs","oct"]},{"id":"rev-11","t":2,"q":"Who convened the Ecumenical Councils, and who made their decisions?","a":"Emperors or empresses convened them together with the leaders of the Church. The bishops made the decisions, and the Church received them.","src":["o4a"]},{"id":"rev-12","t":2,"q":"What makes a council ecumenical in Orthodox understanding?","a":"Not its size, but its reception by the whole Church in all places and times.","src":["oct"]},{"id":"rev-13","t":2,"q":"With what words from Acts do conciliar definitions begin?","a":"It seemed good to the Holy Spirit and to us.","src":["ocs"]},{"id":"rev-14","t":2,"q":"Which councils do the Oriental Orthodox and the Church of the East receive?","a":"The Oriental Orthodox receive the first three. The Church of the East receives the first two.","src":["w-7c"]}]}]}]}];

<script>
/* Listen and Learn: scheduling and session engine. Pure logic, no DOM.
   Runs in the browser (window.LL.Engine) and in Node (module.exports) for tests. */
(function (root) {
  'use strict';
  var DAY = 86400000, SEC = 1000, MIN = 60000;
  var MAX_IVL = 365;
  // ratings: 0 missed, 1 heard (no tap), 2 got it, 3 easy
  var LEVELS = ['New', 'Learning', 'Familiar', 'Solid', 'Strong'];

  function newState() {
    return { s: 'new', ivl: 0, ease: 2.3, due: 0, reps: 0, lapses: 0, last: 0, seen: 0 };
  }
  function getState(store, id) { return store.cards[id] || null; }
  function isNew(st) { return !st || st.s === 'new'; }

  function mastery(st) {
    if (isNew(st)) return 0;
    if (st.s === 'learn' || st.ivl < 2) return 1;
    if (st.ivl < 7) return 2;
    if (st.ivl < 21) return 3;
    return 4;
  }

      var canRate = R.phase === 'answer' || R.phase === 'rate';
      kids.push(h('div', { class: 's-rate' }, [[0, 'Missed', 'r0'], [2, 'Got it', 'r2'], [3, 'Easy', 'r3']].map(function (b) {
        return h('button', { class: 'btn ' + b[2], type: 'button', disabled: !canRate, 'aria-pressed': String(R.rating === b[0]), onclick: function () { rate(b[0]); } }, [h('span', { text: b[1] })]);
      })));
    }
    if (R.hf && AUDIO) kids.push(h('p', { class: 'small muted', text: 'You can lock the phone or switch apps. End anytime: your exact spot is saved.' }));
    kids.push(h('div', { class: 's-ctrl' }, [
      h('button', { class: 'btn', type: 'button', onclick: function () { if (Run) Run.blocked = false; control('pause'); } }, R.paused ? 'Resume' : 'Pause'),
      h('button', { class: 'btn', type: 'button', onclick: function () { control('repeat'); } }, 'Repeat'),
      h('button', { class: 'btn', type: 'button', onclick: function () { control('skip'); } }, 'Skip'),
      h('button', { class: 'btn danger', type: 'button', onclick: function () { endSession(false); } }, 'End')
    ]));
    clear(main); main.appendChild(h('div', { class: 'session' }, kids));
  }
  document.addEventListener('keydown', function (ev) {
    if (!Run || Run.ended || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if (ev.key === ' ') { ev.preventDefault(); control('pause'); }
    else if (ev.key === '1') rate(0); else if (ev.key === '2') rate(2); else if (ev.key === '3') rate(3);
    else if (ev.key === 'ArrowRight') control('skip'); else if (ev.key === 'r' || ev.key === 'R') control('repeat');
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { saveLocal(); pushCloud(); }
    else if (Run && !Run.ended) { tickTime(Run); drawSession(); }
  });

  /* ---------- routing ---------- */
  var VIEWS = { study: viewStudy, library: viewLibrary, progress: viewProgress, method: viewMethod };
  function route() {
    if (Run) { drawSession(); return; }
    var name = (location.hash || '#study').slice(1); if (!VIEWS[name]) name = 'study';
    var top = main.scrollTop, same = main.dataset.view === name;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs a'), function (a) { if (a.dataset.tab === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    clear(main);
    VIEWS[name]().forEach(function (k) { if (k) main.appendChild(k); });
    main.dataset.view = name;
    main.scrollTop = same ? top : 0;
    var L = E.countLessons(DECK, STORE, Date.now());
    document.getElementById('topNote').textContent = L.due ? plural(L.due, 'lesson') + ' due' : (L.started ? 'All caught up' : '');
  }
  window.addEventListener('hashchange', function () { if (!Run) { Voice.stop(); Player.stop(); route(); } });
  Voice.onFail = function () { if (!Run) route(); };
  Voice.onChange = function () { if (!Run) route(); };

  /* ---------- start ---------- */
  var local = loadLocal();
  if (local && local.cards) STORE = E.mergeStores(local, null);
  loadSettings();
  if (STORE.live) { if (!STORE.log.some(function (e) { return e.start === STORE.live.start; })) STORE.log.push(STORE.live); STORE.live = null; saveLocal(); }
  route();
  Voice.init();
  cloudInit();
  window.LL.debug = { store: function () { return STORE; }, run: function () { return Run; }, voice: Voice, player: Player };
})();

</script>
</body>

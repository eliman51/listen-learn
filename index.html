<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen and Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: one-screen app. fixed header, scrolling main, bottom tabs. lapis ink on cool stone, gold used only for progress. */
  --bg: #f1f2ef;
  --surface: #ffffff;
  --sunk: #e7e9e4;
  --ink: #152033;
  --muted: #586374;
  --line: #d5d9d2;
  --accent: #1d4c8a;
  --accent-ink: #ffffff;
  --gold: #a5741a;
  --good: #2c7a4c;
  --warn: #9a6a12;
  --bad: #ad3838;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e131b; --surface: #171e2a; --sunk: #111823; --ink: #e9ecf2; --muted: #9ba6b6; --line: #2a3445;
    --accent: #86aeea; --accent-ink: #0e131b; --gold: #dbac4c; --good: #6cc48d; --warn: #e2ad52; --bad: #ea8585;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e131b; --surface: #171e2a; --sunk: #111823; --ink: #e9ecf2; --muted: #9ba6b6; --line: #2a3445;
  --accent: #86aeea; --accent-ink: #0e131b; --gold: #dbac4c; --good: #6cc48d; --warn: #e2ad52; --bad: #ea8585;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 0 8px color-mix(in srgb, var(--accent) 10%, transparent); margin: 0 6px; }
.brand-name { font: 700 1.35rem/1 var(--display); letter-spacing: .01em; }
.top-note { font-size: .8rem; color: var(--muted); text-align: right; }
main { flex: 1; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 16px; outline: none; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); }
.tabs a { padding: 12px 4px 14px; text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .9rem; border-top: 3px solid transparent; margin-top: -1px; }
.tabs a[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
body.in-session .tabs, body.in-session .top { display: none; }

h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 700 1.9rem/1.1 var(--display); font-variant-numeric: lining-nums; }
h2 { font: 700 1.35rem/1.15 var(--display); }
h3 { font: 700 .78rem/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats.four { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 520px) { .stats.four { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--sunk); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font: 700 1.6rem/1.1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.stat.due b { color: var(--accent); }

button, .chip { font: inherit; color: inherit; }
button { cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .92rem; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.opt b { font-weight: 700; }
.opt span { font-size: .84rem; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt[aria-pressed="true"] b { color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 14px; }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
label.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
label.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-weight: 600; font-size: .9rem; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; }
textarea { min-height: 90px; font-size: .8rem; }
details > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.notice { border-left: 4px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); padding: 10px 12px; border-radius: 6px; font-size: .9rem; }
.notice.info { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }

.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sunk); }
.bar i { display: block; height: 100%; }
.m0 { background: var(--line); } .m1 { background: var(--bad); } .m2 { background: var(--warn); } .m3 { background: color-mix(in srgb, var(--good) 60%, var(--gold)); } .m4 { background: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.p1 { color: var(--bad); border-color: currentColor; } .pill.p2 { color: var(--warn); border-color: currentColor; }
.pill.p3, .pill.p4 { color: var(--good); border-color: currentColor; }
.pill.council { color: var(--gold); border-color: currentColor; }

.unit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.unit > summary { list-style: none; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.unit > summary::-webkit-details-marker { display: none; }
.unit-head { display: flex; gap: 10px; align-items: baseline; }
.unit-n { font: 700 1.25rem/1 var(--display); font-variant-numeric: lining-nums; color: var(--gold); min-width: 1.4em; }
.unit-title { font-weight: 700; flex: 1; }
.unit-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.lesson { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.lesson-text { color: var(--muted); font-size: .92rem; max-width: 65ch; }
.qa { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.qa .q { font-weight: 600; }
.qa .a { color: var(--ink); }
.qa .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qa .more { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: .88rem; }
.srcs { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: .84rem; text-decoration: underline; }
.conf { display: flex; flex-wrap: wrap; gap: 6px; }
.conf .chip { padding: 6px 10px; min-height: 36px; font-size: .8rem; }
.hist { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.hist:first-child { border-top: 0; }

/* session */
.session { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.s-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; }
.s-time { font: 700 1.5rem/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.s-prog { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.s-prog i { display: block; height: 100%; background: var(--gold); width: 0; }
.s-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 8px 0; }
.s-label { display: flex; align-items: center; gap: 10px; }
.s-text { font: 700 1.75rem/1.2 var(--display); font-variant-numeric: lining-nums; text-wrap: balance; max-width: 26ch; }
.s-text.long { font: 500 1.05rem/1.55 var(--body); max-width: 60ch; }
.s-answer { font-size: 1.2rem; font-weight: 600; color: var(--accent); max-width: 40ch; }
.s-extra { font-size: .92rem; color: var(--muted); max-width: 55ch; }
.ring { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; max-width: 320px; }
.ring i { display: block; height: 100%; background: var(--accent); width: 100%; }
.s-rate { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.s-rate .btn { padding: 18px 6px; font-size: 1.05rem; border-radius: 14px; border-width: 2px; }
.s-rate .r0 { border-color: var(--bad); color: var(--bad); }
.s-rate .r2 { border-color: var(--good); color: var(--good); }
.s-rate .r3 { border-color: var(--accent); color: var(--accent); }
.s-rate .btn[aria-pressed="true"] { background: currentColor; }
.s-rate .btn[aria-pressed="true"] span { color: var(--surface); }
.s-ctrl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-bottom: 8px; }
.s-ctrl .btn { padding: 10px 4px; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .ring i, .s-prog i { transition: width .12s linear; } }

</style>
</head>
<body>
<div id="app">
  <header class="top">

    <a href="#method" data-tab="method">Method</a>
  </nav>
</div>

:"Second Council of Constantinople","u":"https://www.newadvent.org/cathen/04308b.htm"},"na-con3":{"p":"Catholic Encyclopedia","t":"Third Council of Constantinople","u":"https://www.newadvent.org/cathen/04310a.htm"},"na-nic2":{"p":"Catholic Encyclopedia","t":"The Second Council of Nicaea","u":"https://www.newadvent.org/cathen/11045a.htm"},"enc-chal":{"p":"New Catholic Encyclopedia","t":"Chalcedon, Council of","u":"https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/chalcedon-council"},"enc-nic2":{"p":"New Catholic Encyclopedia","t":"Nicaea II, Council of","u":"https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/nicaea-ii-council"},"ford-con2":{"p":"Fordham Medieval Sourcebook","t":"Fifth Ecumenical Council: Constantinople II, 553","u":"https://sourcebooks.web.fordham.edu/basis/const2.asp"},"ct":{"p":"Christian History","t":"The Counsels of Christ (the seven councils summarized)","u":"https://www.christianitytoday.com/history/issues/issue-54/counsels-of-christ.html"},"w-nic1":{"p":"Wikipedia","t":"First Council of Nicaea","u":"https://en.wikipedia.org/wiki/First_Council_of_Nicaea"},"w-con1":{"p":"Wikipedia","t":"First Council of Constantinople","u":"https://en.wikipedia.org/wiki/First_Council_of_Constantinople"},"w-eph":{"p":"Wikipedia","t":"Council of Ephesus","u":"https://en.wikipedia.org/wiki/Council_of_Ephesus"},"w-chal":{"p":"Wikipedia","t":"Council of Chalcedon","u":"https://en.wikipedia.org/wiki/Council_of_Chalcedon"},"w-con2":{"p":"Wikipedia","t":"Second Council of Constantinople","u":"https://en.wikipedia.org/wiki/Second_Council_of_Constantinople"},"w-con3":{"p":"Wikipedia","t":"Third Council of Constantinople","u":"https://en.wikipedia.org/wiki/Third_Council_of_Constantinople"},"w-nic2":{"p":"Wikipedia","t":"Second Council of Nicaea","u":"https://en.wikipedia.org/wiki/Second_Council_of_Nicaea"},"w-7c":{"p":"Wikipedia","t":"First seven ecumenical councils","u":"https://en.wikipedia.org/wiki/First_seven_ecumenical_councils"}},"pron":{"homoousios":"ho-mo-OO-see-oss","Theotokos":"thay-oh-TOE-koss","Christotokos":"kris-toh-TOE-koss","filioque":"fill-ee-OH-kway","Nicaea":"nigh-SEE-uh","Chalcedon":"KAL-seh-don","Arius":"AIR-ee-us","Arianism":"AIR-ee-an-izm","Irenaeus":"eye-reh-NAY-us","Eusebius":"you-SEE-bee-us","Eutyches":"YOU-tih-keez","Eutychius":"you-TICK-ee-us","Dioscorus":"dye-OSS-kor-us","Monothelitism":"mon-oh-THELL-it-izm","Monoenergism":"mon-oh-EN-er-jizm","Monophysitism":"mon-OFF-iss-it-izm","Monophysites":"mon-OFF-iss-ites","Quinisext":"KWIN-ih-sext","Trullo":"TROO-low","Pneumatomachians":"new-mat-oh-MACK-ee-ans","Proskynesis":"pross-KIN-eh-sis","Latreia":"lah-TRAY-ah","Henotikon":"heh-NOT-ih-kon","Ekthesis":"EK-theh-sis","hypostasis":"high-POSS-tah-sis","Photius":"FOE-shus","Cerularius":"ser-oo-LAIR-ee-us","Glagolitic":"glag-oh-LIT-ik","Didache":"DID-ah-kay","Chrysostom":"KRIS-us-tum","Pachomius":"pah-KOE-mee-us","Sabellius":"sah-BELL-ee-us","Apollinaris":"ah-poll-in-AIR-iss","Quartodecimans":"kwar-toh-DESS-ih-mans","symphonia":"sim-foe-NEE-ah","Hieria":"hee-AIR-ee-ah","Lazica":"LAZ-ih-kah","Tarasius":"tah-RAY-shus","Vigilius":"vih-JILL-ee-us","Climacus":"KLIM-ah-kus","azymes":"AZ-imes","diptychs":"DIP-ticks","Hagia Sophia":"HAH-yah so-FEE-ah","Pulcheria":"pull-KEER-ee-ah","Pantaenus":"pan-TEE-nus","Hexapla":"HEX-ah-plah","Mopsuestia":"mop-soo-ESS-tee-ah","Cyrrus":"SEER-us","Ibas":"EE-bahs","Sophronius":"so-FROE-nee-us","Heraclius":"heh-RACK-lee-us","Honorius":"ho-NOR-ee-us","Pyrrhus":"PEER-us","Agatho":"AG-ah-tho","Tremithus":"TREM-ih-thus","Caecilian":"see-SILL-ee-an","Meletius":"meh-LEE-shus","Macedonianism":"mass-eh-DOE-nee-an-izm","Novatianism":"no-VAY-shun-izm","Pelagius":"peh-LAY-jee-us","Cherson":"KAIR-sonn","Dnieper":"NEE-per","Rastislav":"RAHS-tiss-lahv","Athenagoras":"ath-en-AG-or-us"},"units":[{"id":"ap","n":1,"title":"The Apostolic Church","era":"First century","segs":[{"id":"ap-s1","title":"From Pentecost to the nations","text":"After the Ascension of Christ, the Holy Spirit came down on the disciples at Pentecost, as told in Acts chapter 2. Christ had chosen the Twelve and the Seventy to lead his Church, and Saint Matthias took the place of Judas. Saint Paul's journeys, recorded in Acts chapters 13 through 28, planted churches across Asia Minor and Greece. Communities soon stood in Syria, Egypt, Armenia, and even India. At Antioch the followers of Christ were first called Christians. They wrote in Greek, the common tongue of the Empire.","cards":[{"id":"ap-01","t":1,"q":"In which city were the followers of Christ first called Christians?","a":"Antioch.","src":["o1a"]},{"id":"ap-02","t":2,"q":"Who was chosen to replace Judas among the Twelve?","a":"Saint Matthias.","src":["o1a"]},{"id":"ap-03","t":2,"q":"Which chapters of Acts record the missionary journeys of Saint Paul?","a":"Acts chapters 13 through 28.","src":["o1a"]},{"id":"ap-04","t":1,"q":"In what language were the New Testament books written, and why?","a":"Greek, the common language of the Roman Empire.","src":["o1a","oqa"]},{"id":"ap-05","t":3,"q":"Until about when did the Church in Rome itself worship in Greek?","a":"Until the beginning of the third century.","src":["o1a"]}]},{"id":"ap-s2","title":"The Council of Jerusalem","text":"The first great question was whether Gentiles had to keep the Law of Moses to enter the Church. The Holy Spirit had already fallen on the Roman centurion Cornelius and his household while Saint Peter was still preaching. Around the year 49 the Apostles met in Jerusalem, as told in Acts chapter 15. Saint James, the Brother of the Lord and first bishop of Jerusalem, led the gathering. The decision: Gentile converts are not bound by the Law of Moses, including circumcision. The Orthodox Church sees this meeting as the prototype of every later council.","cards":[{"id":"ap-06","t":1,"q":"About what year did the Council of Jerusalem meet, and where is it recorded?","a":"Around the year 49. It is recorded in Acts chapter 15.","src":["o1b","oqa"],"note":"The date is approximate."},{"id":"ap-07","t":1,"q":"What did the Council of Jerusalem decide?","a":"Gentile converts are not bound by the Law of Moses, including circumcision.","src":["o1b","oqa"]},{"id":"ap-08","t":1,"q":"Who led the Council of Jerusalem?","a":"Saint James, the Brother of the Lord, the first bishop of Jerusalem.","src":["o1b"]},{"id":"ap-09","t":1,"q":"Why is the Council of Jerusalem so important for later Church history?","a":"It is the prototype of all later Church councils.","src":["o1b","oqa"]},{"id":"ap-10","t":2,"q":"Which Roman centurion's conversion showed that Gentiles could receive the Holy Spirit?","a":"Saint Cornelius, in Acts chapters 10 and 11.","src":["o1b"]}]},{"id":"ap-s3","title":"Martyrdom and the fall of the Temple","text":"Saints Peter and Paul were martyred in Rome under the emperor Nero, around the year 67. Their shared feast is June 29. All of the Twelve except Saint John died as martyrs. The Jewish revolt against Rome began in the year 66, and in the year 70 the Roman army destroyed the Temple in Jerusalem, which the Church reads as the fulfillment of Christ's own prophecy. New believers entered the Church through repentance and Baptism, the laying on of hands, and the Eucharist. By the end of the first century the faith, the structure, and the worship of the Church were firmly in place.","cards":[{"id":"ap-11","t":1,"q":"Under which emperor were Saints Peter and Paul martyred in Rome, and about when?","a":"Under Nero, around the year 67.","src":["o1a"],"note":"The date is approximate."},{"id":"ap-12","t":2,"q":"What is the shared feast day of Saints Peter and Paul?","a":"June 29.","src":["o1a"]},{"id":"ap-13","t":1,"q":"In what year did the Roman army destroy the Temple in Jerusalem?","a":"The year 70.","src":["o1b"],"rq":"What happened in Jerusalem in the year 70?","ra":"The Roman army destroyed the Temple."},{"id":"ap-14","t":2,"q":"Which of the Twelve Apostles did not die as a martyr?","a":"Saint John.","src":["o1a"]},{"id":"ap-15","t":3,"q":"In what year did the Jewish revolt against Rome begin?","a":"The year 66.","src":["o1a"]},{"id":"ap-16","t":2,"q":"How did a new believer enter the Church in the first century?","a":"Through repentance and Baptism, then the laying on of hands for the gift of the Holy Spirit, then the Eucharist.","src":["o1b"]}]}]},{"id":"c2","n":2,"title":"Martyrs, Fathers, and First Heresies","era":"Second century","segs":[{"id":"c2-s1","title":"An illegal religion","text":"In the second century Roman law held that it was not lawful to be a Christian. Christians prayed for the civil authorities, but they refused to honor the emperor as lord and god. Pliny the Younger, governor of Bithynia, wrote to the emperor Trajan to ask how to treat them. Trajan answered that Christians should not be hunted down, but those accused who refused to renounce the faith were to be executed. Persecution was local and came in waves. Around the year 177 a famous group of martyrs suffered at Lyons and Vienne in Gaul.","cards":[{"id":"c2-01","t":1,"q":"Why did Rome treat Christians as criminals in the second century?","a":"They refused to honor the emperor as lord and god, although they prayed for the civil authorities.","src":["o2a","oqa"]},{"id":"c2-02","t":2,"q":"Which Roman governor wrote to the emperor Trajan about how to treat Christians?","a":"Pliny the Younger, governor of Bithynia.","src":["o2a"]},{"id":"c2-03","t":2,"q":"What was Trajan's policy toward Christians?","a":"They were not to be hunted down, but those accused who refused to renounce the faith were to be executed.","src":["o2a"]},{"id":"c2-04","t":2,"q":"Around what year did the martyrs of Lyons and Vienne suffer in Gaul?","a":"Around the year 177.","src":["o2a"]}]},{"id":"c2-s2","title":"The Apostolic Fathers","text":"The Apostolic Fathers wrote in the years right after the Apostles. The three best known are Saint Clement of Rome, Saint Ignatius of Antioch, and Saint Polycarp of Smyrna. Ignatius was martyred in Rome under Trajan, around the year 110. On the road he wrote seven letters. He is the first to call the Church catholic, meaning full, complete, and whole, and he describes one bishop in each church with presbyters and deacons. Polycarp died a martyr around 157, and the account of his death shows Christians already honoring the relics of the martyrs. The Didache is a short manual of Church life from the same age.","cards":[{"id":"c2-05","t":1,"q":"Name the three best known Apostolic Fathers.","a":"Saint Clement of Rome, Saint Ignatius of Antioch, and Saint Polycarp of Smyrna.","src":["o2b"]},{"id":"c2-06","t":1,"q":"About when was Saint Ignatius of Antioch martyred, and where?","a":"Around the year 110, in Rome, under the emperor Trajan.","src":["o2b","b-ign"]},{"id":"c2-07","t":2,"q":"How many letters did Saint Ignatius write on his way to martyrdom?","a":"Seven.","src":["b-ign"]},{"id":"c2-08","t":1,"q":"Who was the first writer to call the Church catholic, and what does the word mean?","a":"Saint Ignatius of Antioch. It means full, complete, and whole.","src":["o2f"]},{"id":"c2-09","t":1,"q":"What threefold ministry does Saint Ignatius describe in each local church?","a":"One bishop, with presbyters and deacons.","src":["o2f","b-ign"]},{"id":"c2-10","t":2,"q":"About when did Saint Polycarp of Smyrna die as a martyr?","a":"Around the year 157.","src":["o2b"],"note":"The date is approximate."},{"id":"c2-11","t":2,"q":"What is the Didache?","a":"A short early manual of Christian living and Church practice, also called the Teaching of the Twelve Apostles.","src":["o2b","o2f"]},{"id":"c2-12","t":3,"q":"What does the account of Polycarp's martyrdom show about early Christian practice?","a":"That Christians already venerated the martyrs and their relics.","src":["o2b"]}]},{"id":"c2-s3","title":"The Apologists and Sunday worship","text":"The Apologists wrote to outsiders, often to the emperor himself, to explain and defend the faith. Such a defense is called an Apology. The leading Apologist was Saint Justin Martyr, the philosopher, who died around 165. In his First Apology, written around 155, chapter 67 describes Sunday worship: readings from the Apostles and Prophets, a sermon, prayers, the offering of bread and wine, the people's Amen, communion, and a collection for the needy. Saint Melito of Sardis wrote the poem On Pascha, with words that still echo in the hymns of Holy Friday.","cards":[{"id":"c2-13","t":1,"q":"Who was the leading Apologist of the second century, and about when did he die?","a":"Saint Justin Martyr, the philosopher, who died around 165.","src":["o2c"]},{"id":"c2-14","t":2,"q":"In the early Church, what is an Apology?","a":"A written defense and explanation of Christianity addressed to outsiders, often to the emperor.","src":["o2c"]},{"id":"c2-15","t":2,"q":"Which work of Saint Justin, written around 155, describes Sunday worship?","a":"His First Apology, chapter 67.","src":["o2f"]},{"id":"c2-16","t":3,"q":"Which second century bishop wrote the liturgical poem On Pascha?","a":"Saint Melito of Sardis.","src":["o2c"]}]},{"id":"c2-s4","title":"Gnostics, Montanists, and Saint Irenaeus","text":"Gnosticism was a group of related heresies that turned Christianity into a spiritualistic, dualistic philosophy. Its great opponent was Saint Irenaeus, bishop of Lyons, who lived from about 130 to about 200 and wrote Against Heresies. He gave three marks of a true Church: the same rule of faith, bishops in unbroken succession from the Apostles, and the four Gospels alone. Around 160, in Asia Minor, Montanus and his prophetesses Priscilla and Maximilla announced a new age of the Spirit. Local councils condemned Montanism. The New Testament canon settled slowly. In 367 Saint Athanasius gave the first list of exactly the 27 books.","cards":[{"id":"c2-17","t":1,"q":"What was Gnosticism?","a":"A group of related heresies that turned Christianity into a spiritualistic, dualistic philosophy.","src":["o2d"]},{"id":"c2-18","t":1,"q":"Who wrote Against Heresies, and what did it refute?","a":"Saint Irenaeus of Lyons. It refuted Gnosticism.","src":["o2d"]},{"id":"c2-19","t":1,"q":"What three marks of a true Church did Saint Irenaeus give?","a":"The same rule of faith, bishops in succession from the Apostles, and the four Gospels alone.","src":["o2d","oqa"]},{"id":"c2-20","t":2,"q":"About when did Saint Irenaeus of Lyons live?","a":"From about 130 to about 200.","src":["o2d"]},{"id":"c2-21","t":2,"q":"What was Montanism, and about when did it begin?","a":"A rigorist prophetic movement begun around 160 in Asia Minor by Montanus, who claimed a new age of the Spirit.","src":["o2d"]},{"id":"c2-22","t":3,"q":"Name the two prophetesses of Montanus.","a":"Priscilla and Maximilla.","src":["o2d"]},{"id":"c2-23","t":1,"q":"Who gave the earliest list of exactly the 27 New Testament books, and in what year?","a":"Saint Athanasius the Great, in 367.","src":["o2d"]}]},{"id":"c2-s5","title":"The Pascha dispute","text":"The Christians of Asia Minor kept Pascha on the 14th day of the Jewish month of Nisan, whatever the day of the week. They were called Quartodecimans, which means Fourteeners. Around the year 190 Pope Victor the First, the first Latin speaking bishop of Rome, tried to excommunicate them. Saint Irenaeus and other bishops rebuked him, even though they agreed Pascha belongs on a Sunday. The story comes to us from Eusebius of Caesarea, the first great Church historian, who died around 340. Orthodox writers see here the first attempt by Rome to rule Churches beyond its own region.","cards":[{"id":"c2-24","t":2,"q":"Who were the Quartodecimans?","a":"Christians of Asia Minor who kept Pascha on the 14th of Nisan, whatever the day of the week.","src":["o2e","b-eph190"]},{"id":"c2-25","t":2,"q":"Which bishop of Rome tried to excommunicate the Quartodecimans around 190?","a":"Pope Victor the First.","src":["o2e","b-eph190"]},{"id":"c2-26","t":2,"q":"How did Saint Irenaeus respond to Pope Victor?","a":"He rebuked him, even though he agreed that Pascha should fall on a Sunday.","src":["o2e"]},{"id":"c2-27","t":2,"q":"Who is called the first great Church historian?","a":"Eusebius of Caesarea, who died around 340.","src":["o2e"]}]}]},{"id":"c3","n":3,"title":"Persecution, the Lapsed, and Alexandria","era":"Third century","segs":[{"id":"c3-s1","title":"Waves of persecution","text":"The third century opened with persecution under Septimius Severus. Saints Perpetua and Felicitas died at Carthage, and in Alexandria the father of Origen was martyred. Then came decades of relative peace. The emperor Decius, who reigned from 249 to 251, launched an intense persecution across the whole Empire. In 257 Valerian began another, aimed at the higher clergy, in the false hope that the Church would die without its leaders. His son Gallienus ended it in 260. By the year 300 perhaps ten percent of the Empire was Christian, about six million people.","cards":[{"id":"c3-01","t":1,"q":"Which emperor launched an intense empire-wide persecution in the middle of the third century?","a":"Decius, who reigned from 249 to 251.","src":["o3a","b-cyp"]},{"id":"c3-02","t":2,"q":"In what year did Valerian's persecution begin, and whom did it target?","a":"In 257. It targeted the higher clergy.","src":["o3a"]},{"id":"c3-03","t":2,"q":"Which emperor ended the general persecution in 260?","a":"Gallienus, the son of Valerian.","src":["o3a"]},{"id":"c3-04","t":2,"q":"Which famous martyrs of Carthage died under Septimius Severus?","a":"Saints Perpetua and Felicitas.","src":["o3a"]},{"id":"c3-05","t":3,"q":"By the year 300, about what share of the Empire may have been Christian?","a":"Perhaps ten percent, about six million people.","src":["o3a"]}]},{"id":"c3-s2","title":"The lapsed and Saint Cyprian","text":"Persecution raised a hard question. What of the lapsed, those who denied Christ under threat and later wished to return? Most bishops allowed them back after sincere repentance and long penance. The Roman priest Novatian refused, and his rigorist schism lasted into the fifth century. The great voice for the unity of the Church was Saint Cyprian, bishop of Carthage, martyred in 258 under Valerian. He wrote On the Unity of the Church, and taught that no one can have God as Father who does not have the Church as mother. He resisted Pope Stephen of Rome, holding that no bishop is a bishop of bishops. Tertullian, the Father of Latin theology, joined the Montanists around 205.","cards":[{"id":"c3-06","t":1,"q":"Who were the lapsed?","a":"Christians who denied Christ under threat of torture or death and later sought to return to the Church.","src":["o3b","oqa"]},{"id":"c3-07","t":1,"q":"How did most bishops come to treat the lapsed?","a":"They allowed them back after sincere repentance and a long penance.","src":["o3b","b-cyp"]},{"id":"c3-08","t":1,"q":"Who was Saint Cyprian, and when was he martyred?","a":"The bishop of Carthage. He was executed in 258, under the emperor Valerian.","src":["o3b","b-cyp"]},{"id":"c3-09","t":2,"q":"What is Saint Cyprian's best known work?","a":"On the Unity of the Church.","src":["o3b","b-cyp"]},{"id":"c3-10","t":2,"q":"Complete Saint Cyprian's teaching: no one can have God as Father who does not have...","a":"...the Church as mother.","src":["o3b"]},{"id":"c3-11","t":2,"q":"What was Novatianism?","a":"A rigorist schism begun by the Roman priest Novatian after the Decian persecution, refusing mercy to the lapsed.","src":["o3b"]},{"id":"c3-12","t":2,"q":"What did Saint Cyprian and Pope Stephen disagree about?","a":"Whether those baptized by heretics or schismatics had to be baptized again. Cyprian held that sacraments outside the Church were invalid.","src":["o3b","b-cyp"]},{"id":"c3-13","t":2,"q":"Who is called the Father of Latin theology, and what movement did he join around 205?","a":"Tertullian of Carthage. He joined the Montanists.","src":["o3b"]},{"id":"c3-14","t":3,"q":"Who became the first antipope in Rome, in 217?","a":"Hippolytus, who was later reconciled and is honored as a saint.","src":["o3b"]}]},{"id":"c3-s3","title":"Origen and the school of Alexandria","text":"The first formal school of Christian theology rose in Alexandria. Pantaenus founded it around the year 180. Clement developed it, and Origen crowned it. Origen lived from about 185 to about 254. His Hexapla set the Old Testament in six columns, and On First Principles was the first systematic theology. He was tortured under Decius. Yet some of his ideas, drawn from Plato, fed later errors, and the Fifth Ecumenical Council condemned them in 553. In Rome, Sabellius taught that Father, Son, and Holy Spirit are merely names for the one God. At Antioch a council in 268 deposed Paul of Samosata.","cards":[{"id":"c3-15","t":1,"q":"Who was Origen, and when did he live?","a":"The great teacher of the school of Alexandria, who lived from about 185 to about 254.","src":["o3c","b-ori"]},{"id":"c3-16","t":2,"q":"Name Origen's two most famous works.","a":"The Hexapla, a six column edition of the Old Testament, and On First Principles.","src":["o3c","b-ori"]},{"id":"c3-17","t":1,"q":"Which council condemned the errors of Origen, and in what year?","a":"The Fifth Ecumenical Council, in 553.","src":["o3c","o6b"]},{"id":"c3-18","t":2,"q":"Who founded the theological school of Alexandria, and about when?","a":"Pantaenus, around the year 180.","src":["o3c"]},{"id":"c3-19","t":2,"q":"What did Sabellius teach?","a":"That Father, Son, and Holy Spirit are merely names for the one God.","src":["o3b"]},{"id":"c3-20","t":2,"q":"Which bishop of Antioch was deposed by a council in 268 for false teaching on the Trinity and Christ?","a":"Paul of Samosata.","src":["o3c"]},{"id":"c3-21","t":3,"q":"In 272, which emperor did the Church ask to remove Paul of Samosata from his throne?","a":"Aurelian. It was the first such appeal to the civil power.","src":["o3c"]},{"id":"c3-22","t":3,"q":"What is told about the city of Saint Gregory the Wonderworker?","a":"He found 17 Christians when he arrived as bishop, and left only 17 pagans when he died.","src":["o3c"]}]}]},{"id":"con","n":4,"title":"Constantine and the Peace of the Church","era":"303 to 337","segs":[{"id":"con-s1","title":"The Great Persecution","text":"In 303 the emperor Diocletian began the longest and widest persecution the Church had known. He was urged on by Galerius, his deputy in the East, who doubted the loyalty of Christian soldiers. Among the martyrs the Church honors from these years are Saint George, Saint Katherine of Alexandria, Saint Panteleimon, and Saint Demetrius of Thessalonica. Diocletian stepped down in 305, and Galerius carried on the persecution until his deathbed in 311, when he asked the Christians to pray for him.","cards":[{"id":"con-01","t":1,"q":"In what year did Diocletian begin the Great Persecution?","a":"303.","src":["o4a"],"rq":"What began in the year 303?","ra":"The Great Persecution under Diocletian."},{"id":"con-02","t":2,"q":"Who urged Diocletian to persecute the Church?","a":"Galerius, his deputy in the East.","src":["o4a"]},{"id":"con-03","t":2,"q":"Name three great martyrs of the Diocletian persecution.","a":"Saint George, Saint Katherine of Alexandria, and Saint Demetrius of Thessalonica. Saint Panteleimon is another.","src":["o4a"]}]},{"id":"con-s2","title":"In this sign, conquer","text":"Constantine was proclaimed emperor at York in Britain in 306. In 312 he marched on Rome against Maxentius. Before the battle he saw a vision of the Cross with the words, In this sign, conquer. He won at the Milvian Bridge. In February 313 he and Licinius met at Milan and gave Christians freedom of worship and the return of their property. In 324 Constantine defeated Licinius and ruled alone. In 330 he dedicated Constantinople as the new capital. His mother, Saint Helen, found the True Cross near Golgotha. He died in 337, baptized on his deathbed. The Church honors him as Equal to the Apostles, with Saint Helen, on May 21.","cards":[{"id":"con-04","t":1,"q":"In what year did Constantine win the Battle of the Milvian Bridge?","a":"312.","src":["o4a"],"rq":"What happened in 312?","ra":"Constantine saw the vision of the Cross and won the Battle of the Milvian Bridge."},{"id":"con-05","t":1,"q":"What did Constantine see before the Battle of the Milvian Bridge?","a":"A vision of the Cross with the words: In this sign, conquer.","src":["o4a","oqa"]},{"id":"con-06","t":1,"q":"What was the Edict of Milan, and when was it issued?","a":"The agreement of Constantine and Licinius in February 313 that gave Christians freedom of worship and the return of confiscated property.","src":["o4a","b-milan"],"rq":"What happened in 313?","ra":"The Edict of Milan gave Christians freedom of worship.","hook":"313 comes one year after the Milvian Bridge in 312, and twelve years before Nicaea in 325."},{"id":"con-07","t":1,"q":"In what year was Constantinople dedicated as the new capital?","a":"330.","src":["o4a"]},{"id":"con-08","t":1,"q":"In what year did Constantine become sole emperor of East and West?","a":"324, after defeating Licinius.","src":["o4a"]},{"id":"con-09","t":2,"q":"Where and when was Constantine first proclaimed emperor?","a":"At York in Britain, in 306.","src":["o4a"]},{"id":"con-10","t":2,"q":"When did Constantine die, and who baptized him?","a":"He died in 337. He was baptized on his deathbed by Eusebius of Nicomedia.","src":["o4a","o4c"]},{"id":"con-11","t":2,"q":"What did Saint Helen, the mother of Constantine, find near Golgotha?","a":"The True Cross.","src":["o4a"]},{"id":"con-12","t":2,"q":"How does the Orthodox Church honor Constantine, and on what day?","a":"As Saint Constantine the Great, Equal to the Apostles, together with Saint Helen, on May 21.","src":["o4a"]},{"id":"con-13","t":2,"q":"What weekly change did Constantine make that still shapes the calendar?","a":"He made Sunday a weekly holiday.","src":["o4a","oqa"]}]},{"id":"con-s3","title":"Symphonia and the Donatists","text":"The Orthodox ideal for Church and empire is called symphonia: the Church cares for souls, the emperor for the realm, and neither rules the other. Peace from outside did not mean peace within. In North Africa the Donatists rejected Caecilian, the lawful bishop of Carthage, partly because he allowed repentance for those who lapsed under Diocletian. A commission at Rome under Pope Miltiades ruled for Caecilian. So did the Council of Arles in Gaul in 314. Constantine tried force from 316 to 321, which only gave the Donatists the air of martyrs. The schism wounded the African Church for centuries.","cards":[{"id":"con-14","t":1,"q":"What does the Orthodox ideal of symphonia mean?","a":"Church and state working in harmony: the Church cares for souls and the emperor for the realm, and neither rules the other.","src":["o4a","o6a"]},{"id":"con-15","t":2,"q":"What was the Donatist schism about?","a":"Rigorists in North Africa rejected Bishop Caecilian of Carthage, partly because he allowed repentance for those who lapsed under Diocletian.","src":["o4b"]},{"id":"con-16","t":2,"q":"Which council in Gaul ruled against the Donatists, and in what year?","a":"The Council of Arles, in 314.","src":["o4b"]}]}]},{"id":"n1","n":5,"title":"First Council: Nicaea, 325","era":"325","council":1,"segs":[{"id":"n1-s1","title":"Arius and his teaching","text":"Arius was a presbyter of Alexandria. Before 318 he began to teach that the Word, the Son of God, is not truly God. He said the Son is a created being, made from nothing, the first and greatest of creatures. His bishop, Saint Alexander of Alexandria, tried to correct him. Arius refused and sought allies. The strongest was Eusebius, bishop of Nicomedia, his old classmate. The Church heard in this teaching a direct attack on Scripture and on her worship of Christ.","cards":[{"id":"n1-01","t":1,"q":"What did Arius teach about the Son of God?","a":"That the Son is a created being, the first and greatest creature, and not truly God.","src":["o4c","b-nic1"]},{"id":"n1-02","t":1,"q":"Who was Arius?","a":"A presbyter of Alexandria who began teaching his heresy before 318.","src":["o4c","b-nic1"]},{"id":"n1-03","t":2,"q":"Which bishop of Alexandria first opposed Arius?","a":"Saint Alexander of Alexandria.","src":["o4c"]},{"id":"n1-04","t":2,"q":"Who was the most powerful ally of Arius among the bishops?","a":"Eusebius of Nicomedia.","src":["o4c"]}]},{"id":"n1-s2","title":"The council meets","text":"After Constantine became sole emperor he learned of the quarrel. On the advice of Saint Hosius, a bishop from Spain, he called a council. It opened on May 20, 325, at Nicaea, near Nicomedia. Tradition counts 318 bishops, among them Saint Nicholas of Myra and Saint Spyridon. Pope Sylvester of Rome sent legates. Athanasius came as a young deacon with Bishop Alexander. The council condemned Arius. It confessed the Son as true God of true God, begotten, not made, of one essence with the Father. The Greek word for of one essence is homoousios. This is the First Ecumenical Council.","cards":[{"id":"n1-05","t":1,"q":"In what year did the First Ecumenical Council meet, and where?","a":"In 325, at Nicaea.","src":["o4d","b-nic1","oct"],"rq":"What happened in the year 325?","ra":"The First Ecumenical Council met at Nicaea and condemned Arianism.","hook":"325 is twelve years after the Edict of Milan in 313."},{"id":"n1-06","t":1,"q":"Which emperor called the First Ecumenical Council?","a":"Constantine the Great.","src":["o4d","b-nic1"]},{"id":"n1-07","t":1,"q":"Which heresy did the Council of Nicaea condemn?","a":"Arianism.","src":["o4d","b-nic1","ocs"]},{"id":"n1-08","t":1,"q":"What Greek word did Nicaea use for the Son's relation to the Father, and what does it mean?","a":"Homoousios, meaning of one essence with the Father.","src":["o4d","b-homo"]},{"id":"n1-09","t":1,"q":"According to tradition, how many bishops attended Nicaea?","a":"318.","src":["o4d","ocs","ct"],"note":"318 is the traditional number. Britannica's article gives no figure."},{"id":"n1-10","t":1,"q":"How does the Creed of Nicaea describe the Son?","a":"True God of true God, begotten, not made, of one essence with the Father, through whom all things were made.","src":["o4d"]},{"id":"n1-11","t":2,"q":"On what date did the Council of Nicaea open?","a":"May 20, 325.","src":["o4d","w-nic1"]},{"id":"n1-12","t":2,"q":"Which two beloved wonderworking bishops are remembered as attending Nicaea?","a":"Saint Nicholas of Myra and Saint Spyridon of Tremithus.","src":["o4d"]},{"id":"n1-13","t":2,"q":"In what role did Saint Athanasius attend Nicaea?","a":"As a deacon of the Church of Alexandria, serving Bishop Alexander.","src":["o4e","b-ath"]},{"id":"n1-14","t":2,"q":"Which bishop advised Constantine to call the council?","a":"Saint Hosius, a bishop from Spain.","src":["o4d"]},{"id":"n1-15","t":2,"q":"Did the bishop of Rome attend Nicaea in person?","a":"No. Pope Sylvester sent legates.","src":["b-nic1"]}]},{"id":"n1-s3","title":"Canons and Pascha","text":"Nicaea also issued twenty canons, rules for Church life. Canon 6 confirmed the regional authority of the great sees: Alexandria over Egypt, Libya, and Pentapolis, with Rome and Antioch keeping their own regions. The council directed that all the Churches keep Pascha at the same time, which helped end the Quartodeciman custom. Canon 20 forbids penitential kneeling at the Sunday Liturgy and through the season from Pascha to Pentecost. The Church remembers the Fathers of Nicaea on May 29, and again on the seventh Sunday after Pascha.","cards":[{"id":"n1-16","t":2,"q":"How many canons did Nicaea issue?","a":"Twenty.","src":["ocs"]},{"id":"n1-17","t":2,"q":"What did canon 6 of Nicaea confirm?","a":"The regional authority of the great sees: Alexandria over Egypt, Libya, and Pentapolis, with Rome and Antioch keeping their own regions.","src":["o4d","b-nic1"]},{"id":"n1-18","t":2,"q":"What did Nicaea decide about Pascha?","a":"That all the Churches should keep Pascha at the same time, which helped end the Quartodeciman practice.","src":["o4d","o2e","b-nic1"],"note":"Britannica adds that a fully uniform date was not achieved in practice."},{"id":"n1-19","t":3,"q":"What does canon 20 of Nicaea forbid?","a":"Penitential kneeling at the Sunday Liturgy and during the season from Pascha to Pentecost.","src":["o4d"]},{"id":"n1-20","t":3,"q":"On what days does the Church commemorate the Fathers of the First Council?","a":"On May 29, and on the seventh Sunday after Pascha.","src":["ocs"]}]}]},{"id":"ath","n":6,"title":"Defending Nicaea: Athanasius and the Cappadocians","era":"325 to 381","segs":[{"id":"ath-s1","title":"Athanasius against the world","text":"Nicaea did not end the struggle. For more than five decades emperors and bishops kept trying to water down its faith. The chief defender was Saint Athanasius. He became bishop of Alexandria in 328 and died in 373. For the faith of Nicaea he was exiled five times, under Constantine, twice under Constantius, under Julian, and under Valens. He wrote On the Incarnation, the Orations Against the Arians, and the Life of Saint Anthony. Near the end of his life his forgiving spirit toward former enemies helped bring the controversy to a close.","cards":[{"id":"ath-01","t":1,"q":"How many times was Saint Athanasius exiled for defending Nicaea?","a":"Five times.","src":["o4e","b-ath"]},{"id":"ath-02","t":1,"q":"In what year did Athanasius become bishop of Alexandria, and when did he die?","a":"He became bishop in 328 and died in 373.","src":["o4e","b-ath"]},{"id":"ath-03","t":2,"q":"When did the first exile of Athanasius begin, and under whom?","a":"In 335, under Constantine.","src":["o4e","b-ath"],"note":"OCA gives 335. Britannica gives 336."},{"id":"ath-04","t":2,"q":"Name three works of Saint Athanasius.","a":"On the Incarnation, the Life of Saint Anthony, and the Orations Against the Arians.","src":["b-ath","o4i"]},{"id":"ath-05","t":2,"q":"How long did the Arian controversy continue after Nicaea?","a":"For more than five decades, until the Second Ecumenical Council in 381.","src":["o4e","o4g"]},{"id":"ath-06","t":3,"q":"Under which emperors was Athanasius exiled?","a":"Constantine, Constantius twice, Julian, and Valens.","src":["b-ath"]}]},{"id":"ath-s2","title":"New heresies and the Cappadocian Fathers","text":"In the middle of the fourth century two new errors appeared. The Macedonians, also called Pneumatomachians, which means fighters against the Spirit, said the Holy Spirit is a creature. Apollinaris taught that in Christ the divine Word took the place of a human soul, so that Christ was not fully human. Three Fathers from Cappadocia answered them: Saint Basil the Great, his brother Saint Gregory of Nyssa, and his friend Saint Gregory the Theologian. Basil wrote On the Holy Spirit and his monastic Rules. Gregory the Theologian answered Apollinaris in one line: what has not been assumed has not been healed.","cards":[{"id":"ath-07","t":1,"q":"Name the three Cappadocian Fathers.","a":"Saint Basil the Great, his brother Saint Gregory of Nyssa, and his friend Saint Gregory the Theologian.","src":["o4g","o4f","b-basil"]},{"id":"ath-08","t":1,"q":"What did the Macedonians, or Pneumatomachians, teach?","a":"That the Holy Spirit is a created being and not fully divine.","src":["o4f"]},{"id":"ath-09","t":2,"q":"What does the name Pneumatomachians mean?","a":"Fighters against the Spirit.","src":["o4f"]},{"id":"ath-10","t":1,"q":"What did Apollinaris teach?","a":"That the divine Word took the place of a human soul in Christ, so that Christ was not fully human.","src":["o4f"]},{"id":"ath-11","t":1,"q":"What was Saint Gregory the Theologian's answer to Apollinaris?","a":"What has not been assumed has not been healed.","src":["o4f","o7b"]},{"id":"ath-12","t":2,"q":"Which work of Saint Basil defends the divinity of the Holy Spirit?","a":"On the Holy Spirit.","src":["o4f"]},{"id":"ath-13","t":2,"q":"When did Saint Basil the Great become bishop of Caesarea, and when did he die?","a":"He became bishop in 370 and died in 379.","src":["b-basil","o4f"]},{"id":"ath-14","t":2,"q":"Which three saints bear the title, the Theologian?","a":"Saint John the Evangelist, Saint Gregory of Nazianzus, and Saint Symeon the New Theologian.","src":["o4f","o10a"]},{"id":"ath-15","t":3,"q":"Who was the first Father to plainly call the Holy Spirit God?","a":"Saint Gregory the Theologian.","src":["o4f"]},{"id":"ath-16","t":2,"q":"What kind of monastic life did the Rules of Saint Basil promote?","a":"Communal monasticism, each monastery under an abbot and the local bishop.","src":["o4f","b-basil"]}]}]},{"id":"c1","n":7,"title":"Second Council: Constantinople, 381","era":"381","council":2,"segs":[{"id":"c1-s1","title":"Theodosius calls the council","text":"Theodosius the Great became emperor in the East in 379. He held the faith of Nicaea, and in February 380 he required it of his subjects. In 381 he called a council at Constantinople. About 150 bishops came, all from the East. Its leaders included Saint Gregory the Theologian, Saint Gregory of Nyssa, and Saint Meletius of Antioch. The council condemned every form of Arianism, condemned the Macedonians, and condemned Apollinaris. Later in the century Theodosius, advised by Saint Ambrose of Milan, made Christianity the religion of the state.","cards":[{"id":"c1-01","t":1,"q":"In what year did the Second Ecumenical Council meet, and where?","a":"In 381, at Constantinople.","src":["o4g","b-con1","oct"],"rq":"What happened in 381?","ra":"The Second Ecumenical Council met at Constantinople and completed the Creed.","hook":"381 is 56 years after Nicaea, and exactly 50 years before Ephesus in 431."},{"id":"c1-02","t":1,"q":"Which emperor called the Second Ecumenical Council?","a":"Theodosius the Great.","src":["o4g","b-con1"]},{"id":"c1-03","t":1,"q":"How many bishops attended the Second Ecumenical Council?","a":"About 150, all from the East.","src":["b-con1","ocs"]},{"id":"c1-04","t":1,"q":"Which three heresies did the council of 381 condemn?","a":"Arianism, Macedonianism, and Apollinarianism.","src":["o4g"]},{"id":"c1-05","t":2,"q":"Name three leaders at the Second Ecumenical Council.","a":"Saint Gregory the Theologian, Saint Gregory of Nyssa, and Saint Meletius of Antioch.","src":["o4g"]},{"id":"c1-06","t":2,"q":"When did Theodosius become emperor in the East, and what did his edict of February 380 require?","a":"He became emperor in 379. The edict required his subjects to hold the Nicene faith.","src":["o4g","b-theo"]},{"id":"c1-07","t":2,"q":"Which emperor, advised by Saint Ambrose of Milan, made Christianity the religion of the state?","a":"Saint Theodosius the Great, who reigned from 379 to 395.","src":["o4a","b-theo"]}]},{"id":"c1-s2","title":"The Creed completed, and New Rome","text":"The council's great work was the Creed. To the faith of Nicaea it added the section on the Holy Spirit, confessing his divinity. The result is the Nicene-Constantinopolitan Creed, which the Orthodox call the Symbol of Faith and recite at every Baptism and Divine Liturgy. Canon 2 told bishops to keep to their own regions. Canon 3 gave the bishop of Constantinople the prerogative of honor after the bishop of Rome, because Constantinople is New Rome. Pope Damasus rejected that canon. Yet East and West both came to receive this council as ecumenical. The Church remembers its Fathers on May 22.","cards":[{"id":"c1-08","t":1,"q":"What did the Second Council add to the Creed of Nicaea?","a":"The section confessing the divinity of the Holy Spirit, completing the Creed said today.","src":["o4g","b-con1","oct"]},{"id":"c1-09","t":1,"q":"What is the full name of the Creed completed in 381, and what do the Orthodox call it?","a":"The Nicene-Constantinopolitan Creed, also called the Symbol of Faith.","src":["o4g","b-con1"]},{"id":"c1-10","t":1,"q":"What did canon 3 of Constantinople say?","a":"The bishop of Constantinople has the prerogative of honor after the bishop of Rome, because Constantinople is New Rome.","src":["o4g","b-con1"]},{"id":"c1-11","t":2,"q":"How did Pope Damasus respond to canon 3?","a":"He rejected it, although the council itself came to be received as ecumenical in East and West.","src":["o4g","b-con1"]},{"id":"c1-12","t":2,"q":"What did canon 2 of Constantinople require of bishops?","a":"That they not interfere in the affairs of other regions.","src":["o4g","ct"]},{"id":"c1-13","t":3,"q":"How many canons does the Orthodox Church count from the Second Council?","a":"Seven.","src":["ocs","ct"]},{"id":"c1-14","t":3,"q":"On what day does the Church commemorate the Fathers of the Second Council?","a":"May 22.","src":["ocs"]}]}]},{"id":"gold","n":8,"title":"Monks, Preachers, and the West","era":"Fourth and fifth centuries","segs":[{"id":"gold-s1","title":"The desert","text":"When persecution ended, many Christians went out to the desert to serve God alone. They called this life a white martyrdom, a bloodless daily dying to the passions. It began in Egypt. Saint Paul of Thebes is remembered as the first hermit. Saint Anthony the Great, who lived from about 250 to 356, is called the founder of monasticism, and Saint Athanasius wrote his Life. Saint Pachomius founded communal monasteries, the cenobitic life. In the West, Saint Benedict of Nursia later wrote a Rule that guided monks for five hundred years.","cards":[{"id":"gold-01","t":1,"q":"Who is traditionally called the founder of monasticism, and when did he live?","a":"Saint Anthony the Great, from about 250 to 356.","src":["o4i"]},{"id":"gold-02","t":1,"q":"Who founded communal, or cenobitic, monasticism in Egypt?","a":"Saint Pachomius.","src":["o4i"]},{"id":"gold-03","t":2,"q":"Who wrote the Life of Saint Anthony, which spread monasticism widely?","a":"Saint Athanasius the Great.","src":["o4i","b-ath"]},{"id":"gold-04","t":2,"q":"Who is remembered as the first desert hermit?","a":"Saint Paul of Thebes.","src":["o4i"]},{"id":"gold-05","t":2,"q":"Why did the monks call their life a white martyrdom?","a":"Because it was a bloodless, daily dying to the passions.","src":["o4i"]},{"id":"gold-06","t":3,"q":"Which Western monastic founder wrote a Rule that guided the West for about five hundred years?","a":"Saint Benedict of Nursia, who founded Monte Cassino.","src":["o4i","o6f"]}]},{"id":"gold-s2","title":"Saint John Chrysostom","text":"John of Antioch, born around 347, preached so well that he was named Chrysostom, the golden mouth. In 398 he became archbishop of Constantinople. He preached against luxury and offended the empress Eudoxia. The Synod of the Oak condemned him in 403, and in 404 he was sent into exile. He died in 407 on a forced march, saying, Glory to God for all things. In 438 his relics came home to Constantinople in triumph. The Church honors him as her greatest preacher. The two chief Liturgies, of Saint Basil and Saint John Chrysostom, took their shape in this century.","cards":[{"id":"gold-07","t":1,"q":"What does the name Chrysostom mean?","a":"Golden mouth.","src":["o4j"]},{"id":"gold-08","t":1,"q":"In what year did Saint John Chrysostom become archbishop of Constantinople?","a":"398.","src":["o4j","b-chrys"]},{"id":"gold-09","t":1,"q":"In what year did Saint John Chrysostom die, and how?","a":"In 407, in exile, on a forced march.","src":["o4j","b-chrys"]},{"id":"gold-10","t":2,"q":"What were the last words of Saint John Chrysostom?","a":"Glory to God for all things.","src":["o4j"]},{"id":"gold-11","t":2,"q":"Which empress did Chrysostom's preaching against luxury offend?","a":"The empress Eudoxia.","src":["o4j","b-chrys"]},{"id":"gold-12","t":3,"q":"Which synod condemned Chrysostom in 403?","a":"The Synod of the Oak.","src":["b-chrys"]},{"id":"gold-13","t":2,"q":"In what year were Chrysostom's relics brought back to Constantinople?","a":"438.","src":["o4j","b-chrys"]},{"id":"gold-14","t":2,"q":"Which two Liturgies took their main shape in the fourth century?","a":"The Divine Liturgies of Saint Basil the Great and Saint John Chrysostom.","src":["o4h"]}]},{"id":"gold-s3","title":"Augustine and the Latin West","text":"In the Latin West the towering figure was Saint Augustine, bishop of Hippo in North Africa, who lived from 354 to 430. He wrote the Confessions and the City of God. He fought the Donatists, the Manicheans, and Pelagius, a British monk who taught that people can save themselves by their own virtue without grace. Against Pelagius, Augustine went too far the other way. The Orthodox teaching is synergism: grace and human freedom work together. Saint John Cassian, trained in Egypt, taught this in the West. In 476 Germanic rulers took over the government in Rome, and East and West began to drift apart.","cards":[{"id":"gold-15","t":1,"q":"When did Saint Augustine of Hippo live?","a":"From 354 to 430.","src":["b-aug","o5h"]},{"id":"gold-16","t":2,"q":"Name Saint Augustine's two most famous books.","a":"The Confessions and the City of God.","src":["o5h","b-aug"]},{"id":"gold-17","t":1,"q":"What did Pelagius teach?","a":"That people can save themselves by their own virtue, without divine grace.","src":["o5h"]},{"id":"gold-18","t":1,"q":"What is synergism, the Orthodox teaching on grace and freedom?","a":"God's grace and human free will work together in salvation. The will was damaged by the Fall but not destroyed.","src":["o5h"]},{"id":"gold-19","t":2,"q":"Which Western monk, trained in Egypt, taught synergism in his Conferences?","a":"Saint John Cassian.","src":["o5h"]},{"id":"gold-20","t":2,"q":"Which teachings of Augustine does the Orthodox tradition find problematic?","a":"His extreme view of the fallen human will, which led toward predestination, and his speculation on the Trinity that helped prepare the filioque.","src":["o5h"]},{"id":"gold-21","t":1,"q":"In what year did Germanic rulers take over the Western Roman Empire?","a":"476.","src":["o5h","o8b"]}]}]},{"id":"eph","n":9,"title":"Third Council: Ephesus, 431","era":"431","council":3,"segs":[{"id":"eph-s1","title":"Nestorius and the Theotokos","text":"Nestorius was bishop of Constantinople from 428 to 431. He refused to call the Virgin Mary Theotokos, a title that means the one who gave birth to God. He said the one born of Mary was a man in whom the Word of God dwelt, and he offered the title Christotokos instead. Saint Cyril, bishop of Alexandria, answered him, with the support of Pope Celestine of Rome. Cyril's point was about Christ. The Son of God, begotten of the Father before all ages, and the Son of Mary are one and the same. So Mary is truly the Mother of God.","cards":[{"id":"eph-01","t":1,"q":"What does the title Theotokos mean?","a":"The one who gave birth to God.","src":["o5a"]},{"id":"eph-02","t":1,"q":"What did Nestorius teach?","a":"That Mary should be called Christotokos, not Theotokos, because the one born of her was a man in whom the Word dwelt.","src":["o5a","b-nest"]},{"id":"eph-03","t":1,"q":"Who led the Orthodox opposition to Nestorius?","a":"Saint Cyril of Alexandria, supported by Pope Celestine of Rome.","src":["o5a","b-cyril"]},{"id":"eph-04","t":1,"q":"Why does the title Theotokos matter for what we believe about Christ?","a":"Because the Son of God and the Son of Mary are one and the same person.","src":["o5a"]},{"id":"eph-05","t":2,"q":"Which see did Nestorius hold, and in what years?","a":"He was bishop of Constantinople from 428 to 431.","src":["o5a"]}]},{"id":"eph-s2","title":"The council and the peace of 433","text":"In 431 the emperor Theodosius the Second called a council at Ephesus. Saint Cyril presided. Nestorius would not yield, and the council condemned him. John, bishop of Antioch, arrived four days late with his bishops and at first refused the verdict. Two years later, in 433, Cyril and John signed the Formulary of Peace. It kept the condemnation of Nestorius and honored the concern of Antioch for the full humanity of Christ. Canon 7 of Ephesus forbids composing a different faith from the Creed. Canon 8 protects the independence of the Church of Cyprus. The Church counts about 200 Fathers and keeps their feast on September 9.","cards":[{"id":"eph-06","t":1,"q":"In what year did the Third Ecumenical Council meet, and where?","a":"In 431, at Ephesus.","src":["o5b","oct","ocs"],"rq":"What happened in 431?","ra":"The Third Ecumenical Council met at Ephesus, condemned Nestorius, and confessed Mary as Theotokos.","hook":"431 is exactly 50 years after 381, and 20 years before Chalcedon in 451."},{"id":"eph-07","t":1,"q":"Which emperor called the Council of Ephesus?","a":"Theodosius the Second.","src":["o5b","w-eph"]},{"id":"eph-08","t":1,"q":"What did the Council of Ephesus decide?","a":"It condemned Nestorius and confessed that Christ is one person, so that Mary is truly Theotokos.","src":["o5b","oct","ocs"]},{"id":"eph-09","t":1,"q":"What agreement in 433 reconciled Cyril of Alexandria and John of Antioch?","a":"The Formulary of Peace.","src":["o5b","b-cyril"]},{"id":"eph-10","t":2,"q":"Which bishop arrived late at Ephesus and at first refused the verdict of the council?","a":"John of Antioch.","src":["o5b","b-cyril"]},{"id":"eph-11","t":2,"q":"What does canon 7 of Ephesus forbid, and why do the Orthodox cite it?","a":"Composing a different faith from the Creed. The Orthodox cite it against adding the filioque.","src":["o5g"]},{"id":"eph-12","t":3,"q":"What did canon 8 of Ephesus protect?","a":"The independence of the Church of Cyprus from Antioch.","src":["o5g"]},{"id":"eph-13","t":2,"q":"About how many Fathers does the Church count at Ephesus, and when is their feast?","a":"About 200. Their feast is September 9.","src":["ocs","w-eph"]},{"id":"eph-14","t":3,"q":"On what dates did the Council of Ephesus sit?","a":"From June 22 to July 31, 431.","src":["w-eph"]}]}]},{"id":"chal","n":10,"title":"Fourth Council: Chalcedon, 451","era":"451","council":4,"segs":[{"id":"chal-s1","title":"The Robber Council","text":"Saint Cyril died in 444. His successor Dioscorus pushed Cyril's phrase, one nature of the Word of God incarnate, to an extreme. His ally Eutyches said the humanity of Christ is not like ours. In 449 a council at Ephesus, backed by the emperor Theodosius the Second, upheld Eutyches and deposed his opponents. Pope Leo the Great had sent a letter, the Tome of Leo, addressed to Flavian of Constantinople, teaching two complete natures in Christ. The council would not let it be read. Leo called the gathering a council of robbers. Then in July 450 the emperor died after a fall from his horse. His sister Pulcheria and her consort Marcian took the throne.","cards":[{"id":"chal-01","t":1,"q":"What was the Robber Council, and when did it meet?","a":"A council at Ephesus in 449, led by Dioscorus of Alexandria, that upheld Eutyches. Pope Leo called it a council of robbers.","src":["o5c","enc-chal"]},{"id":"chal-02","t":1,"q":"What did Eutyches teach?","a":"That the humanity of Christ is not like ours, so that his divinity all but swallowed his humanity.","src":["o5c"]},{"id":"chal-03","t":1,"q":"What is the Tome of Leo?","a":"A letter of Pope Leo the Great, sent in 449 to Flavian of Constantinople, teaching the two complete natures of Christ.","src":["o5c","b-leo"]},{"id":"chal-04","t":2,"q":"What event in July 450 opened the way to Chalcedon?","a":"The emperor Theodosius the Second died after a fall from his horse. His sister Pulcheria and her consort Marcian took the throne.","src":["o5c","enc-chal"]}]},{"id":"chal-s2","title":"The Definition of Chalcedon","text":"In 451 Marcian and Pulcheria called a council at Chalcedon, across the water from Constantinople. It was the largest of the seven. Tradition counts 630 bishops, and modern references about 520. The Fathers held together Cyril's teaching, the concern of Antioch, and the Tome of Leo. When the Tome was read they cried, Peter has spoken through Leo, yet they examined it before receiving it. The Definition confesses one and the same Christ, perfect God and perfect man, one person in two natures, united without confusion, without change, without division, without separation. Canon 28 gave Constantinople, the New Rome, equal privileges with Old Rome. Rome rejected that canon.","cards":[{"id":"chal-05","t":1,"q":"In what year did the Fourth Ecumenical Council meet, and where?","a":"In 451, at Chalcedon, across the water from Constantinople.","src":["o5d","b-chal","oct"],"rq":"What happened in 451?","ra":"The Fourth Ecumenical Council met at Chalcedon and defined that Christ is one person in two natures.","hook":"451 is 20 years after Ephesus, and two years after the Robber Council of 449."},{"id":"chal-06","t":1,"q":"Who convened the Council of Chalcedon?","a":"The emperor Marcian and the empress Pulcheria.","src":["o5d","b-chal"]},{"id":"chal-07","t":1,"q":"What does the Definition of Chalcedon confess about Christ?","a":"One person in two natures, divine and human, perfect God and perfect man.","src":["o5d","oct","b-chal"]},{"id":"chal-08","t":1,"q":"Give the four phrases of Chalcedon on how the two natures are united.","a":"Without confusion, without change, without division, without separation.","src":["o5d"]},{"id":"chal-09","t":1,"q":"Which heresy did Chalcedon reject?","a":"Monophysitism, the teaching of Eutyches that Christ has only one nature.","src":["ocs","b-chal","o5c"]},{"id":"chal-10","t":2,"q":"What did the bishops cry out when the Tome of Leo was read?","a":"Peter has spoken through Leo.","src":["o5d"],"note":"OCA stresses that the council examined the Tome before receiving it, and did not treat it as the final word."},{"id":"chal-11","t":2,"q":"How many bishops attended Chalcedon?","a":"Tradition says 630. Modern references estimate about 520. It was the largest of the seven councils.","src":["o5d","ocs","b-chal","enc-chal"],"note":"Sources differ. The New Catholic Encyclopedia estimates 350 to 360 bishops present in person."},{"id":"chal-12","t":1,"q":"What did canon 28 of Chalcedon grant?","a":"Equal privileges for Constantinople, the New Rome, with Old Rome. Rome rejected the canon.","src":["o5g","o7e"]},{"id":"chal-13","t":2,"q":"Which two sees did Chalcedon recognize as patriarchates?","a":"Constantinople and Jerusalem.","src":["b-chal"]},{"id":"chal-14","t":3,"q":"On what dates did Chalcedon sit, and when is the feast of its Fathers?","a":"From October 8 to November 1, 451. The feast is July 16.","src":["w-chal","enc-chal","ocs"]},{"id":"chal-15","t":3,"q":"How many canons does the Orthodox Church count from Chalcedon?","a":"Thirty.","src":["ocs"]}]},{"id":"chal-s3","title":"After Chalcedon","text":"Many of Cyril's strictest followers rejected Chalcedon. They held to his phrase, one nature of the Word of God incarnate, and were called Monophysites. The Orthodox answer is that Cyril meant one person, which is exactly what Chalcedon taught. In 482 the emperor Zeno and Patriarch Acacius issued the Henotikon, an edict of union that avoided saying one nature or two. Rome broke communion in 484, and the Acacian Schism lasted until 518, when the emperor Justin the First ended it. The Churches that never accepted Chalcedon are today the Oriental Orthodox: Coptic, Ethiopian, Syrian, Armenian, and the Malankara Church of India.","cards":[{"id":"chal-16","t":1,"q":"Which Churches today descend from those who rejected Chalcedon?","a":"The Oriental Orthodox Churches: Coptic, Ethiopian, Syrian, Armenian, and the Malankara Church of India.","src":["o6c"]},{"id":"chal-17","t":2,"q":"Which phrase of Saint Cyril did the opponents of Chalcedon insist on?","a":"One nature of the Word of God incarnate.","src":["o5e","o5c"]},{"id":"chal-18","t":2,"q":"How does the Orthodox Church understand Cyril's phrase, one nature of the Word incarnate?","a":"As meaning one person, or hypostasis, which is exactly what Chalcedon confessed.","src":["o5e","o6b"]},{"id":"chal-19","t":2,"q":"What was the Henotikon, and when was it issued?","a":"An edict of union issued in 482 by the emperor Zeno with Patriarch Acacius. It avoided saying one nature or two.","src":["o5f"]},{"id":"chal-20","t":2,"q":"What was the Acacian Schism?","a":"A break between Rome and the East from 484 to 518, after Pope Felix rejected the Henotikon.","src":["o5f","o6a"]},{"id":"chal-21","t":3,"q":"Which emperor ended the Acacian Schism in 518?","a":"Justin the First, the uncle of Justinian.","src":["o6a"]}]}]},{"id":"c5","n":11,"title":"Fifth Council: Constantinople, 553","era":"553","council":5,"segs":[{"id":"c5-s1","title":"The age of Justinian","text":"Justinian the First reigned from 527 to 565. The Orthodox Church honors him as a saint and a theologian. He wanted one empire and one faith. He closed the pagan school of Athens in 529. His law code, the Code of Justinian, was issued in 534. He built Hagia Sophia in Constantinople, dedicated to Christ the Wisdom of God. In his day the Church was pictured as five great patriarchates: Rome, Constantinople, Alexandria, Antioch, and Jerusalem. Justinian called them the five senses of the universe. This order of five is called the pentarchy.","cards":[{"id":"c5-01","t":1,"q":"When did the emperor Justinian the First reign?","a":"From 527 to 565.","src":["o6a","b-just"]},{"id":"c5-02","t":1,"q":"Name the five ancient patriarchates, the pentarchy.","a":"Rome, Constantinople, Alexandria, Antioch, and Jerusalem.","src":["o6e","oqa"]},{"id":"c5-03","t":2,"q":"What did Justinian call the five patriarchates?","a":"The five senses of the universe.","src":["o6e"]},{"id":"c5-04","t":2,"q":"What great church in Constantinople did Justinian build?","a":"Hagia Sophia, dedicated to Christ the Wisdom of God.","src":["o6d"]},{"id":"c5-05","t":2,"q":"What did Justinian do in 529, and what was issued in 534?","a":"In 529 he closed the pagan school of Athens. In 534 his law code, the Code of Justinian, was issued.","src":["o6d","b-just"]}]},{"id":"c5-s2","title":"The Three Chapters and the council","text":"Justinian longed to win back those who rejected Chalcedon. They suspected Chalcedon of leaning toward Nestorius. So Justinian condemned the Three Chapters: the person and writings of Theodore of Mopsuestia, the teacher of Nestorius, and the pro-Nestorian writings of Theodoret of Cyrrus and Ibas of Edessa. In 553 the Fifth Ecumenical Council met at Constantinople, from May 5 to June 2, with Patriarch Eutychius presiding. It condemned the Three Chapters and confessed Christ as one of the Holy Trinity, one divine person in two natures. It also condemned Origen and his later followers. Pope Vigilius opposed the council, then ratified it in February 554.","cards":[{"id":"c5-06","t":1,"q":"In what year did the Fifth Ecumenical Council meet, and where?","a":"In 553, at Constantinople.","src":["o6a","b-con2","oct"],"rq":"What happened in 553?","ra":"The Fifth Ecumenical Council met at Constantinople and condemned the Three Chapters and the errors of Origen.","hook":"Five, five, three: the Fifth council begins with two fives."},{"id":"c5-07","t":1,"q":"What were the Three Chapters?","a":"The person and writings of Theodore of Mopsuestia, and the pro-Nestorian writings of Theodoret of Cyrrus and Ibas of Edessa.","src":["o6a","ford-con2"]},{"id":"c5-08","t":1,"q":"Why did Justinian want the Three Chapters condemned?","a":"To show the opponents of Chalcedon that the Church was not Nestorian, and so win them back.","src":["o6a","o6b"]},{"id":"c5-09","t":1,"q":"Besides the Three Chapters, whose teachings did the Fifth Council condemn?","a":"Origen and his later followers, including the ideas that souls existed before bodies and that all, even demons, will finally be saved.","src":["o6b","b-con2","ocs"]},{"id":"c5-10","t":2,"q":"Who presided at the Fifth Council?","a":"Patriarch Eutychius of Constantinople.","src":["b-con2","w-con2"]},{"id":"c5-11","t":2,"q":"How did Pope Vigilius respond to the Fifth Council?","a":"He opposed it and stayed away, but ratified its decisions in February 554.","src":["b-con2","b-vig"]},{"id":"c5-12","t":2,"q":"What did the Fifth Council affirm with the phrase, one of the Holy Trinity?","a":"That Jesus Christ is one divine person, the Son of God, who united divinity and humanity in himself.","src":["o6b"]},{"id":"c5-13","t":3,"q":"On what dates did the Fifth Council sit?","a":"From May 5 to June 2, 553.","src":["w-con2","na-con2"]},{"id":"c5-14","t":3,"q":"How many Fathers attended the Fifth Council?","a":"Tradition counts 165. Modern lists give about 152.","src":["ocs","ct","w-con2"]},{"id":"c5-15","t":2,"q":"Did the Fifth Council issue disciplinary canons?","a":"No. Neither the Fifth nor the Sixth Council issued canons, which is why the Council in Trullo was later called.","src":["ocs","o7d"]},{"id":"c5-16","t":3,"q":"When is the feast of the Fathers of the Fifth Council?","a":"July 25.","src":["ocs"]}]},{"id":"c5-s3","title":"The sixth century West","text":"By 553 the opponents of Chalcedon had their own bishops, and the council did not bring them back. In the West, Pope Saint Gregory the Great guided Rome through the Lombard invasions and sent missionaries to England. He objected when Saint John the Faster of Constantinople took the title Ecumenical Patriarch. And in Spain, most likely at the Council of Toledo in 589, the words and the Son were added to the Creed, to stress the divinity of Christ to the Arian Visigoths. In Latin the addition is one word, filioque. The Orthodox hold that no local council may alter the Creed of the whole Church.","cards":[{"id":"c5-17","t":2,"q":"Which patriarch of Constantinople first used the title Ecumenical Patriarch, and which pope objected?","a":"Saint John the Faster. Pope Saint Gregory the Great objected.","src":["o6e"]},{"id":"c5-18","t":1,"q":"Where and when was the filioque most likely first added to the Creed?","a":"In Spain, at the Council of Toledo in 589.","src":["o6f","oqa"]},{"id":"c5-19","t":2,"q":"Why was the filioque first added in Spain?","a":"To stress the divinity of Christ to the Arian Visigoths.","src":["o6f","oqa"]}]}]},{"id":"c6","n":12,"title":"Sixth Council: Constantinople, 680 to 681","era":"680 to 681","council":6,"segs":[{"id":"c6-s1","title":"One energy, one will","text":"In 610 Heraclius became emperor and Sergius became patriarch of Constantinople. They wanted to reunite the empire with those who rejected Chalcedon. Sergius offered a formula: in Christ there is one divine and human energy. This is Monoenergism. In 633 the elderly monk Sophronius, soon to be patriarch of Jerusalem, objected that it denied Christ a human energy. Sergius then proposed one will instead, and Pope Honorius of Rome agreed. This is Monothelitism. In 638 Heraclius proclaimed it by a decree called the Ekthesis.","cards":[{"id":"c6-01","t":1,"q":"What is Monothelitism?","a":"The teaching that Christ has only one will.","src":["o7a","b-mono"]},{"id":"c6-02","t":1,"q":"What is Monoenergism?","a":"The teaching that Christ has only one energy, or operation.","src":["o7a"]},{"id":"c6-03","t":1,"q":"Which emperor and patriarch promoted these teachings to reunite the empire?","a":"The emperor Heraclius and Patriarch Sergius of Constantinople.","src":["o7a","b-mono"]},{"id":"c6-04","t":2,"q":"What was the Ekthesis, and when was it issued?","a":"The decree of the emperor Heraclius in 638 that proclaimed one will in Christ.","src":["o7a","b-mono"]},{"id":"c6-05","t":1,"q":"Who first objected to Monoenergism, in 633?","a":"Saint Sophronius, who became patriarch of Jerusalem.","src":["o7a"]},{"id":"c6-06","t":1,"q":"Which pope accepted the formula of one will and was later condemned for it?","a":"Pope Honorius of Rome.","src":["o7a","o7c","b-con3"]}]},{"id":"c6-s2","title":"Saint Maximus the Confessor","text":"Saint Maximus the Confessor lived from about 580 to 662. He had been secretary to the emperor Heraclius before he became a monk. He taught that each nature of Christ has its own will and energy. Christ has the divine will he shares with the Father and the Spirit, and a true human will like ours. He healed our will by freely submitting his human will to the divine. In 649 Pope Saint Martin held a council in Rome that condemned the new teaching. Both men were arrested, tried, and exiled. The tongue and right hand of Maximus were cut off. He died in exile in 662.","cards":[{"id":"c6-07","t":1,"q":"Who was the chief theologian against Monothelitism, and when did he live?","a":"Saint Maximus the Confessor, from about 580 to 662.","src":["o7a","b-max"]},{"id":"c6-08","t":1,"q":"What did Saint Maximus teach about the wills of Christ?","a":"Christ has two wills, divine and human, because each nature has its own will and energy. He healed the human will by freely submitting it to the divine will.","src":["o7b","oqa"]},{"id":"c6-09","t":2,"q":"What happened in Rome in 649?","a":"Pope Saint Martin, inspired by Saint Maximus, held a council that condemned Monoenergism and Monothelitism.","src":["o7b","b-max"]},{"id":"c6-10","t":2,"q":"What did Saint Maximus suffer for his confession?","a":"He was tried and exiled, and his tongue and right hand were cut off.","src":["o7b"]},{"id":"c6-11","t":3,"q":"Where and when did Saint Maximus die?","a":"In exile in Lazica, in modern Georgia, on August 13, 662.","src":["b-max"]},{"id":"c6-12","t":3,"q":"Which emperor had Saint Maximus arrested?","a":"Constans the Second.","src":["b-max"]}]},{"id":"c6-s3","title":"The council","text":"The teaching of Sophronius, Maximus, and Martin won in the end. The emperor Constantine the Fourth called the Sixth Ecumenical Council. It met at Constantinople from November 7, 680, to September 16, 681. Pope Saint Agatho of Rome prepared the way. The council defined that Christ has two natural wills and two natural energies, divine and human. It condemned the patriarchs Sergius, Pyrrhus, Paul, and Peter of Constantinople, and it condemned Pope Honorius of Rome. The Church counts 170 Fathers and keeps their feast on January 23.","cards":[{"id":"c6-13","t":1,"q":"In what years did the Sixth Ecumenical Council meet, and where?","a":"In 680 to 681, at Constantinople.","src":["o7c","b-con3","oct"],"rq":"What happened in 680 to 681?","ra":"The Sixth Ecumenical Council met at Constantinople and condemned Monothelitism.","hook":"Six eighty for the Sixth council."},{"id":"c6-14","t":1,"q":"Which emperor called the Sixth Ecumenical Council?","a":"Constantine the Fourth.","src":["b-con3","w-con3"]},{"id":"c6-15","t":1,"q":"What did the Sixth Council define?","a":"That Christ has two natural wills and two natural energies, divine and human.","src":["ocs","b-con3","o7c"]},{"id":"c6-16","t":1,"q":"Whom did the Sixth Council condemn?","a":"The patriarchs Sergius, Pyrrhus, Paul, and Peter of Constantinople, and Pope Honorius of Rome.","src":["o7c","b-con3","na-con3"]},{"id":"c6-17","t":2,"q":"Which pope prepared the way for the Sixth Council?","a":"Pope Saint Agatho.","src":["o7c","b-mono"]},{"id":"c6-18","t":3,"q":"On what dates did the Sixth Council sit?","a":"From November 7, 680, to September 16, 681.","src":["w-con3"]},{"id":"c6-19","t":3,"q":"How many Fathers does the Church count at the Sixth Council, and when is their feast?","a":"170. Their feast is January 23.","src":["ocs"]}]},{"id":"c6-s4","title":"Trullo and the rise of Islam","text":"The Fifth and Sixth Councils issued no canons. So in 692 the Eastern bishops met in the imperial palace in Constantinople, in the hall called Trullo. They issued 102 canons. This is the Council in Trullo, or Quinisext Council, meaning fifth-sixth. Canon 13 upheld the marriages of deacons and priests, against the Roman rule. Rome never accepted this council. Meanwhile the world had changed. The Muslim era is counted from 622, when Mohammed left Mecca for Medina. By 644 Arab armies held Egypt, Palestine, and Syria. Most of the Christians who rejected Chalcedon now lived under Muslim rule, cut off from the Byzantine Church.","cards":[{"id":"c6-20","t":1,"q":"What was the Council in Trullo, and when did it meet?","a":"A council at Constantinople in 692 that issued 102 canons. It is also called the Quinisext
